<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Quản Lý Lớp Học & Sổ Điểm Điện Tử</title>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

    header { background-color: var(--primary); color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-md); }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-actions { display: flex; align-items: center; gap: 12px; }

    .nav-bar { background-color: #ffffff; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 0 16px; box-shadow: var(--shadow-sm); }
    .nav-bar button { background: none; border: none; padding: 14px 18px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .nav-bar button:hover { color: var(--primary); }
    .nav-bar button.active { color: var(--primary); border-bottom-color: var(--primary); }

    .sub-bar { background: #f1f5f9; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .sub-bar-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; }

    .container { max-width: 1280px; margin: 24px auto; padding: 0 16px; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; color: var(--primary); border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; transition: border-color 0.2s; background: #ffffff; }
    .form-control:focus { outline: none; border-color: var(--primary); ring: 2px rgba(30, 64, 175, 0.2); }
    textarea.form-control { resize: vertical; min-height: 90px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; gap: 6px; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-danger:hover { background-color: #b91c1c; }
    .btn-success { background-color: var(--success); color: white; }
    .btn-success:hover { background-color: #15803d; }
    .btn-warning { background-color: var(--warning); color: white; }
    .btn-warning:hover { background-color: #b45309; }
    .btn-secondary { background-color: #64748b; color: white; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background-color: #f1f5f9; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    table th, table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    table th { background-color: #f8fafc; font-weight: 600; color: #334155; }
    table tr:nth-child(even) { background-color: #fdfdfe; }
    table tr:hover { background-color: #f1f5f9; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-primary { background-color: #dbeafe; color: #1e40af; }
    .badge-success { background-color: #dcfce7; color: #166534; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }
    .badge-warning { background-color: #fef3c7; color: #92400e; }

    .modal-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(2px); }
    .modal-box { background-color: white; border-radius: 10px; max-width: 840px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }

    .random-box { background: var(--primary-light); border: 2px dashed #3b82f6; border-radius: 8px; padding: 16px; text-align: center; }
    .random-num { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .random-name { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .highlight-score { font-weight: 700; color: var(--primary); }
    .text-center { text-align: center; }
    .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Config Firebase thật của dự án
    const firebaseConfig = {
      apiKey: "AIzaSyBKI6CPLt3M159K9GdD0GUVfDIAaYzemvg",
      authDomain: "sodiemonline.firebaseapp.com",
      projectId: "sodiemonline",
      storageBucket: "sodiemonline.firebasestorage.app",
      messagingSenderId: "928218267233",
      appId: "1:928218267233:web:889914f0ebcbf529eeb420",
      measurementId: "G-LEF5EWHC11"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const round1 = (val) => Math.round(val * 10) / 10;
    const round2 = (val) => Math.round(val * 100) / 100;
    const formatScore = (val) => (val === null || val === undefined || isNaN(val)) ? '-' : val.toString().replace('.', ',');

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginSubmitting, setLoginSubmitting] = useState(false);

      const [currentTab, setCurrentTab] = useState('DASHBOARD');

      // State dữ liệu chung
      const [semesterSetting, setSemesterSetting] = useState({ semester: 'HK1', calculateSpecialTopic: false });
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');

      // State dữ liệu lớp
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [scoreColumns, setScoreColumns] = useState([]);
      const [scoreEntries, setScoreEntries] = useState([]);
      const [scoreHistories, setScoreHistories] = useState([]);
      const [conversionColumns, setConversionColumns] = useState([]);
      const [conversionMappings, setConversionMappings] = useState([]);

      // State quản lý lớp & học sinh
      const [newClassName, setNewClassName] = useState('');
      const [newClassSpecial, setNewClassSpecial] = useState(true);
      const [importRawStudents, setImportRawStudents] = useState('');
      const [importError, setImportError] = useState('');

      // State quản lý nhóm
      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupMembers, setSelectedGroupMembers] = useState([]);

      // State nhập điểm nhóm
      const [groupScoreModal, setGroupScoreModal] = useState(false);
      const [groupScoreTargetCol, setGroupScoreTargetCol] = useState(null);
      const [groupScoreTargetGroup, setGroupScoreTargetGroup] = useState(null);
      const [groupScoreVal, setGroupScoreVal] = useState('');
      const [groupMemberParticipations, setGroupMemberParticipations] = useState({});

      // State chuyển loại cột điểm
      const [moveColModalOpen, setMoveColModalOpen] = useState(false);
      const [colToMove, setColToMove] = useState(null);
      const [targetScoreType, setTargetScoreType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // State tạo cột điểm mới
      const [newColName, setNewColName] = useState('');
      const [newColType, setNewColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // State nhập điểm chuỗi
      const [stringInputModal, setStringInputModal] = useState(false);
      const [activeColForInput, setActiveColForInput] = useState(null);
      const [rawScoreString, setRawScoreString] = useState('');
      const [parsedPreviewScores, setParsedPreviewScores] = useState(null);
      const [stringInputError, setStringInputError] = useState('');

      // State nhập bảng (Table Input)
      const [tableInputModal, setTableInputModal] = useState(false);
      const [activeColForTableInput, setActiveColForTableInput] = useState(null);
      const [tableDraftScores, setTableDraftScores] = useState({});

      // State quy đổi và tỉ trọng
      const [newConvColName, setNewConvColName] = useState('');
      const [newConvColType, setNewConvColType] = useState('THUONG_XUYEN_BAO_TRUOC');
      const [convMappingModal, setConvMappingModal] = useState(false);
      const [activeConvCol, setActiveConvCol] = useState(null);
      const [mappingDraftWeights, setMappingDraftWeights] = useState({});

      // State điểm cải thiện & điểm cộng
      const [improvementModal, setImprovementModal] = useState(false);
      const [improvementWeight, setImprovementWeight] = useState(30);
      const [improvementDraftScores, setImprovementDraftScores] = useState({});
      const [appliedImprovements, setAppliedImprovements] = useState({}); // { [studentId]: { score: number, weight: number } }

      const [bonusModal, setBonusModal] = useState(false);
      const [appliedBonuses, setAppliedBonuses] = useState({}); // { [studentId]: bonusNumber }

      // State Random học sinh
      const [randomClassId, setRandomClassId] = useState('');
      const [randomQty, setRandomQty] = useState(1);
      const [randomResults, setRandomResults] = useState([]);

      // State Xuất Excel Preview
      const [excelPreviewOpen, setExcelPreviewOpen] = useState(false);

      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
          setCurrentUser(user);
          setAuthLoading(false);
          if (user) {
            setCurrentTab('DASHBOARD');
          }
        });
        return () => unsubscribe();
      }, []);

      // Tải cấu hình chung và danh sách lớp
      const loadGlobalConfig = async () => {
        try {
          const db = firebase.firestore();
          const semDoc = await db.collection('semesterSettings').doc('GLOBAL_CONFIG').get();
          if (semDoc.exists) {
            setSemesterSetting(semDoc.data());
          }

          const classSnap = await db.collection('classes').get();
          const list = [];
          classSnap.forEach(d => list.push({ id: d.id, ...d.data() }));
          setClasses(list);
          if (list.length > 0 && !selectedClassId) {
            setSelectedClassId(list[0].id);
            setRandomClassId(list[0].id);
          }
        } catch (e) {
          console.error("Lỗi nạp cấu hình:", e);
        }
      };

      useEffect(() => {
        loadGlobalConfig();
      }, [currentUser]);

      // Tải dữ liệu riêng biệt của lớp khi giáo viên đã đăng nhập
      const loadClassData = async (classId) => {
        if (!classId || !currentUser) return;
        try {
          const db = firebase.firestore();

          // 1. Học sinh
          const stSnap = await db.collection('students').where('classId', '==', classId).get();
          const stList = [];
          stSnap.forEach(d => stList.push({ id: d.id, ...d.data() }));
          stList.sort((a, b) => a.orderNumber - b.orderNumber);
          setStudents(stList);

          // 2. Nhóm
          const grpSnap = await db.collection('groups').where('classId', '==', classId).get();
          const grpList = [];
          grpSnap.forEach(d => grpList.push({ id: d.id, ...d.data() }));
          setGroups(grpList);

          // 3. Cột điểm gốc
          const colSnap = await db.collection('scoreColumns').where('classId', '==', classId).get();
          const colList = [];
          colSnap.forEach(d => colList.push({ id: d.id, ...d.data() }));
          setScoreColumns(colList);

          // 4. Điểm nhập
          const entSnap = await db.collection('scoreEntries').where('classId', '==', classId).get();
          const entList = [];
          entSnap.forEach(d => entList.push({ id: d.id, ...d.data() }));
          setScoreEntries(entList);

          // 5. Lịch sử điểm
          const histSnap = await db.collection('scoreHistory').where('classId', '==', classId).get();
          const histList = [];
          histSnap.forEach(d => histList.push({ id: d.id, ...d.data() }));
          histList.sort((a, b) => b.timestamp - a.timestamp);
          setScoreHistories(histList);

          // 6. Cột quy đổi
          const convSnap = await db.collection('conversionColumns').where('classId', '==', classId).get();
          const convList = [];
          convSnap.forEach(d => convList.push({ id: d.id, ...d.data() }));
          setConversionColumns(convList);

          // 7. Mapping quy đổi
          const mapSnap = await db.collection('conversionMappings').get();
          const mapList = [];
          mapSnap.forEach(d => mapList.push({ id: d.id, ...d.data() }));
          setConversionMappings(mapList);

        } catch (err) {
          console.error("Lỗi khi tải dữ liệu lớp:", err);
        }
      };

      useEffect(() => {
        if (selectedClassId && currentUser) {
          loadClassData(selectedClassId);
        }
      }, [selectedClassId, currentUser]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginSubmitting(true);
        try {
          await firebase.auth().signInWithEmailAndPassword(loginEmail.trim(), loginPass);
          setLoginModalOpen(false);
          setLoginEmail('');
          setLoginPass('');
        } catch (err) {
          if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            setLoginError('Email hoặc mật khẩu không chính xác.');
          } else if (err.code === 'auth/invalid-email') {
            setLoginError('Định dạng email không hợp lệ.');
          } else {
            setLoginError('Đăng nhập thất bại: ' + err.message);
          }
        } finally {
          setLoginSubmitting(false);
        }
      };

      const handleLogout = async () => {
        await firebase.auth().signOut();
        setCurrentTab('DASHBOARD');
      };

      // Thay đổi và lưu học kỳ / tính chuyên đề
      const handleSaveSemesterSetting = async (sem, calcSpecial) => {
        const payload = { semester: sem, calculateSpecialTopic: calcSpecial, updatedAt: Date.now() };
        try {
          await firebase.firestore().collection('semesterSettings').doc('GLOBAL_CONFIG').set(payload);
          setSemesterSetting(payload);
        } catch (e) {
          console.error("Lỗi cập nhật học kỳ:", e);
        }
      };

      // Quản lý tạo lớp
      const handleCreateClass = async (e) => {
        e.preventDefault();
        if (!newClassName.trim()) return;
        try {
          const db = firebase.firestore();
          const ref = db.collection('classes').doc();
          const newCls = {
            id: ref.id,
            name: newClassName.trim(),
            hasSpecialTopic: newClassSpecial,
            createdAt: Date.now(),
            createdBy: currentUser.email
          };
          await ref.set(newCls);
          setNewClassName('');
          await loadGlobalConfig();
          setSelectedClassId(newCls.id);
        } catch (err) {
          console.error("Lỗi tạo lớp:", err);
        }
      };

      // Xóa lớp
      const handleDeleteClass = async (classId) => {
        try {
          const db = firebase.firestore();
          await db.collection('classes').doc(classId).delete();
          await loadGlobalConfig();
          if (selectedClassId === classId) {
            setSelectedClassId(classes.find(c => c.id !== classId)?.id || '');
          }
        } catch (e) {
          console.error("Lỗi xóa lớp:", e);
        }
      };

      // Nhập danh sách học sinh theo format <STT>,<Mã HS>,<Họ và tên>
      const handleImportStudents = async (e) => {
        e.preventDefault();
        setImportError('');
        if (!importRawStudents.trim() || !selectedClassId) return;

        const lines = importRawStudents.trim().split('\n').filter(l => l.trim().length > 0);
        const parsed = [];
        const seenCodes = new Set();

        for (let i = 0; i < lines.length; i++) {
          const parts = lines[i].split(',').map(s => s.trim());
          if (parts.length !== 3) {
            setImportError(`Dòng ${i + 1} sai định dạng: cần đúng <STT>,<Mã HS>,<Họ và tên>`);
            return;
          }
          const orderNum = parseInt(parts[0], 10);
          const code = parts[1].toUpperCase();
          const name = parts[2];

          if (isNaN(orderNum) || !code || !name) {
            setImportError(`Dòng ${i + 1} có giá trị rỗng hoặc STT không phải là số.`);
            return;
          }

          if (seenCodes.has(code)) {
            setImportError(`Trùng lặp Mã HS [${code}] tại dòng ${i + 1}`);
            return;
          }
          seenCodes.add(code);
          parsed.push({ orderNumber: orderNum, studentCode: code, fullName: name });
        }

        try {
          const db = firebase.firestore();
          const batch = db.batch();

          parsed.forEach(st => {
            const ref = db.collection('students').doc(`${selectedClassId}_${st.studentCode}`);
            batch.set(ref, {
              id: `${selectedClassId}_${st.studentCode}`,
              classId: selectedClassId,
              orderNumber: st.orderNumber,
              studentCode: st.studentCode,
              fullName: st.fullName,
              createdAt: Date.now()
            });
          });

          await batch.commit();
          setImportRawStudents('');
          loadClassData(selectedClassId);
        } catch (err) {
          setImportError('Lỗi khi lưu danh sách học sinh: ' + err.message);
        }
      };

      const handleCreateGroup = async (e) => {
        e.preventDefault();
        if (!newGroupName.trim() || !selectedClassId) return;
        try {
          const db = firebase.firestore();
          const ref = db.collection('groups').doc();
          await ref.set({
            id: ref.id,
            classId: selectedClassId,
            name: newGroupName.trim(),
            memberStudentIds: selectedGroupMembers,
            createdAt: Date.now()
          });
          setNewGroupName('');
          setSelectedGroupMembers([]);
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi tạo nhóm:", err);
        }
      };

      const handleDissolveGroup = async (groupId) => {
        try {
          const db = firebase.firestore();
          await db.collection('groups').doc(groupId).delete();
          loadClassData(selectedClassId);
        } catch (e) {
          console.error("Lỗi giải tán nhóm:", e);
        }
      };

      // Mở modal nhập điểm nhóm
      const openGroupScoreInput = (col, group) => {
        setGroupScoreTargetCol(col);
        setGroupScoreTargetGroup(group);
        setGroupScoreVal('');
        const initialParticipations = {};
        (group.memberStudentIds || []).forEach(sid => {
          initialParticipations[sid] = true; // Mặc định có tham gia
        });
        setGroupMemberParticipations(initialParticipations);
        setGroupScoreModal(true);
      };

      const handleSaveGroupScore = async () => {
        const score = parseFloat(groupScoreVal.replace(',', '.'));
        if (isNaN(score) || score < 0 || score > 10) {
          return;
        }

        try {
          const db = firebase.firestore();
          const batch = db.batch();
          const now = Date.now();

          const snapshot = {
            groupId: groupScoreTargetGroup.id,
            groupName: groupScoreTargetGroup.name,
            membersSnapshot: groupScoreTargetGroup.memberStudentIds || []
          };

          (groupScoreTargetGroup.memberStudentIds || []).forEach(stId => {
            const st = students.find(s => s.id === stId);
            if (!st) return;

            const hasParticipated = groupMemberParticipations[stId] !== false;
            const finalStScore = hasParticipated ? round1(score) : 0;
            const entryId = `${selectedClassId}_${stId}_${groupScoreTargetCol.id}`;
            const entryRef = db.collection('scoreEntries').doc(entryId);

            batch.set(entryRef, {
              id: entryId,
              classId: selectedClassId,
              studentId: stId,
              studentCode: st.studentCode,
              scoreColumnId: groupScoreTargetCol.id,
              scoreType: 'DIEM_NHOM',
              semester: groupScoreTargetCol.semester,
              score: finalStScore,
              participationStatus: hasParticipated ? 'CO_THAM_GIA' : 'KHONG_THAM_GIA',
              groupSnapshot: snapshot,
              updatedAt: now,
              createdBy: currentUser.email
            });

            // Lịch sử bất biến
            const hRef = db.collection('scoreHistory').doc();
            batch.set(hRef, {
              id: hRef.id,
              scoreEntryId: entryId,
              classId: selectedClassId,
              studentId: stId,
              studentCode: st.studentCode,
              semester: groupScoreTargetCol.semester,
              scoreType: 'DIEM_NHOM',
              scoreColumnName: groupScoreTargetCol.name,
              newScore: finalStScore,
              participationStatus: hasParticipated ? 'CO_THAM_GIA' : 'KHONG_THAM_GIA',
              groupSnapshot: snapshot,
              reason: hasParticipated ? 'Nhập điểm nhóm' : 'Không tham gia hoạt động nhóm (Ghi nhận 0 điểm)',
              modifiedBy: currentUser.email,
              timestamp: now
            });
          });

          await batch.commit();
          setGroupScoreModal(false);
          loadClassData(selectedClassId);
        } catch (e) {
          console.error("Lỗi lưu điểm nhóm:", e);
        }
      };

      // Tạo cột điểm mới
      const handleCreateColumn = async (e) => {
        e.preventDefault();
        if (!newColName.trim() || !selectedClassId) return;
        try {
          const db = firebase.firestore();
          const colRef = db.collection('scoreColumns').doc();
          await colRef.set({
            id: colRef.id,
            classId: selectedClassId,
            name: newColName.trim(),
            type: newColType,
            semester: semesterSetting.semester,
            createdAt: Date.now()
          });
          setNewColName('');
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi tạo cột:", err);
        }
      };

      // Chuyển loại cột điểm đã nhập sang loại khác (Bảo toàn 100% điểm và lịch sử)
      const handleExecuteChangeColumnType = async () => {
        if (!colToMove || !targetScoreType) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();

          // 1. Cập nhật type ở scoreColumns
          const colRef = db.collection('scoreColumns').doc(colToMove.id);
          batch.update(colRef, { type: targetScoreType });

          // 2. Cập nhật type trong các bản ghi scoreEntries
          const relEntries = scoreEntries.filter(e => e.scoreColumnId === colToMove.id);
          relEntries.forEach(ent => {
            const entryRef = db.collection('scoreEntries').doc(ent.id);
            batch.update(entryRef, { scoreType: targetScoreType });
          });

          // 3. Ghi vết lịch sử chuyển đổi cột
          const histRef = db.collection('scoreHistory').doc();
          batch.set(histRef, {
            id: histRef.id,
            classId: selectedClassId,
            scoreColumnName: colToMove.name,
            reason: `Chuyển cột từ [${colToMove.type}] sang [${targetScoreType}]`,
            timestamp: Date.now(),
            modifiedBy: currentUser.email,
            participationStatus: 'KHONG_AP_DUNG'
          });

          await batch.commit();
          setMoveColModalOpen(false);
          setColToMove(null);
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi chuyển loại cột:", err);
        }
      };

      const handlePreviewScoreString = () => {
        setStringInputError('');
        setParsedPreviewScores(null);
        if (!rawScoreString.trim()) {
          setStringInputError('Vui lòng nhập chuỗi điểm');
          return;
        }

        const tokens = rawScoreString.trim().split(/\s+/).map(s => s.replace(',', '.'));
        if (tokens.length !== students.length) {
          setStringInputError(`Chuỗi có ${tokens.length} điểm, nhưng lớp có đúng ${students.length} học sinh.`);
          return;
        }

        const scores = [];
        for (let i = 0; i < tokens.length; i++) {
          const val = parseFloat(tokens[i]);
          if (isNaN(val) || val < 0 || val > 10) {
            setStringInputError(`Điểm STT ${i + 1} (${tokens[i]}) không hợp lệ (phải từ 0 đến 10)`);
            return;
          }
          scores.push(round1(val));
        }
        setParsedPreviewScores(scores);
      };

      const handleSaveScoreString = async () => {
        if (!parsedPreviewScores || !activeColForInput) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          const now = Date.now();

          students.forEach((st, idx) => {
            const sc = parsedPreviewScores[idx];
            const entryId = `${selectedClassId}_${st.id}_${activeColForInput.id}`;
            const entryRef = db.collection('scoreEntries').doc(entryId);

            batch.set(entryRef, {
              id: entryId,
              classId: selectedClassId,
              studentId: st.id,
              studentCode: st.studentCode,
              scoreColumnId: activeColForInput.id,
              scoreType: activeColForInput.type,
              semester: activeColForInput.semester || semesterSetting.semester,
              score: sc,
              updatedAt: now,
              createdBy: currentUser.email
            });

            const hRef = db.collection('scoreHistory').doc();
            batch.set(hRef, {
              id: hRef.id,
              scoreEntryId: entryId,
              classId: selectedClassId,
              studentId: st.id,
              studentCode: st.studentCode,
              semester: activeColForInput.semester || semesterSetting.semester,
              scoreType: activeColForInput.type,
              scoreColumnName: activeColForInput.name,
              newScore: sc,
              participationStatus: 'CO_THAM_GIA',
              modifiedBy: currentUser.email,
              timestamp: now
            });
          });

          await batch.commit();
          setStringInputModal(false);
          setRawScoreString('');
          setParsedPreviewScores(null);
          loadClassData(selectedClassId);
        } catch (e) {
          console.error("Lỗi lưu điểm chuỗi:", e);
        }
      };

      // Nhập điểm theo bảng (Table Input)
      const openTableInput = (col) => {
        setActiveColForTableInput(col);
        const drafts = {};
        students.forEach(st => {
          const entry = scoreEntries.find(e => e.studentId === st.id && e.scoreColumnId === col.id);
          drafts[st.id] = (entry && entry.score !== null && !isNaN(entry.score)) ? entry.score.toString().replace('.', ',') : '';
        });
        setTableDraftScores(drafts);
        setTableInputModal(true);
      };

      const handleSaveTableScores = async () => {
        if (!activeColForTableInput) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          const now = Date.now();

          students.forEach(st => {
            const rawVal = tableDraftScores[st.id];
            if (rawVal !== undefined && rawVal !== '') {
              const val = parseFloat(rawVal.replace(',', '.'));
              if (!isNaN(val) && val >= 0 && val <= 10) {
                const finalSc = round1(val);
                const entryId = `${selectedClassId}_${st.id}_${activeColForTableInput.id}`;
                const entryRef = db.collection('scoreEntries').doc(entryId);

                batch.set(entryRef, {
                  id: entryId,
                  classId: selectedClassId,
                  studentId: st.id,
                  studentCode: st.studentCode,
                  scoreColumnId: activeColForTableInput.id,
                  scoreType: activeColForTableInput.type,
                  semester: activeColForTableInput.semester,
                  score: finalSc,
                  updatedAt: now,
                  createdBy: currentUser.email
                });

                const hRef = db.collection('scoreHistory').doc();
                batch.set(hRef, {
                  id: hRef.id,
                  scoreEntryId: entryId,
                  classId: selectedClassId,
                  studentId: st.id,
                  studentCode: st.studentCode,
                  semester: activeColForTableInput.semester,
                  scoreType: activeColForTableInput.type,
                  scoreColumnName: activeColForTableInput.name,
                  newScore: finalSc,
                  participationStatus: 'CO_THAM_GIA',
                  modifiedBy: currentUser.email,
                  timestamp: now
                });
              }
            }
          });

          await batch.commit();
          setTableInputModal(false);
          loadClassData(selectedClassId);
        } catch (e) {
          console.error("Lỗi lưu điểm bảng:", e);
        }
      };

      // Random học sinh không trùng lặp
      const handleRunRandom = async () => {
        if (!randomClassId) return;
        try {
          const db = firebase.firestore();
          const snap = await db.collection('students').where('classId', '==', randomClassId).get();
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));

          if (list.length === 0) {
            setRandomResults([]);
            return;
          }

          const count = Math.min(Math.max(1, parseInt(randomQty) || 1), list.length);
          const shuffled = [...list];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          setRandomResults(shuffled.slice(0, count));
        } catch (e) {
          console.error("Lỗi random học sinh:", e);
        }
      };

      const tableCalculations = useMemo(() => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const hasSpecial = curClass ? curClass.hasSpecialTopic : true;

        return students.map(student => {
          const studentScores = scoreEntries.filter(e => e.studentId === student.id);

          // 1. Điểm quy đổi từng cột
          const convMap = {};
          conversionColumns.forEach(cc => {
            const maps = conversionMappings.filter(m => m.conversionColumnId === cc.id);
            if (maps.length === 0) {
              // Mặc định tính trung bình nếu chưa cấu hình tỉ trọng cụ thể
              const relCols = scoreColumns.filter(c => c.type === cc.scoreType);
              let sum = 0;
              let cnt = 0;
              relCols.forEach(col => {
                const ent = studentScores.find(e => e.scoreColumnId === col.id);
                if (ent && ent.score !== null && !isNaN(ent.score)) {
                  sum += ent.score;
                  cnt++;
                }
              });
              convMap[cc.id] = cnt > 0 ? round1(sum / cnt) : null;
              return;
            }

            let sum = 0;
            let totalW = 0;
            maps.forEach(m => {
              const ent = studentScores.find(e => e.scoreColumnId === m.scoreColumnId);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                sum += ent.score * (m.weight / 100);
                totalW += m.weight;
              }
            });
            convMap[cc.id] = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          });

          // 2. Điểm cải thiện
          const imp = appliedImprovements[student.id];
          if (imp && imp.score !== null && !isNaN(imp.score)) {
            // Tìm cột thường xuyên có điểm quy đổi thấp nhất
            let lowestColId = null;
            let lowestScore = 11;
            Object.keys(convMap).forEach(cid => {
              const s = convMap[cid];
              if (s !== null) {
                if (s === 0) {
                  lowestColId = cid;
                  lowestScore = 0;
                } else if (s < lowestScore) {
                  lowestScore = s;
                  lowestColId = cid;
                }
              }
            });

            if (lowestColId) {
              if (lowestScore === 0) {
                convMap[lowestColId] = round1(imp.score);
              } else {
                const baseWeight = (100 - imp.weight) / 100;
                const impW = imp.weight / 100;
                convMap[lowestColId] = round1(convMap[lowestColId] * baseWeight + imp.score * impW);
              }
            }
          }

          // 3. Phân bổ điểm cộng: CHỈ CỘNG VÀO CỘT THƯỜNG XUYÊN QUY ĐỔI
          let bonusRemain = appliedBonuses[student.id] || 0;
          while (bonusRemain > 0) {
            let candidateId = null;
            let minVal = 10;
            Object.keys(convMap).forEach(cid => {
              const val = convMap[cid];
              if (val !== null && val < 10) {
                if (candidateId === null || val < minVal) {
                  minVal = val;
                  candidateId = cid;
                }
              }
            });

            if (!candidateId) break; // Toàn bộ các cột đã 10.0 -> bỏ phần dư
            const curVal = convMap[candidateId];
            const canAdd = Math.min(round1(10 - curVal), bonusRemain);
            convMap[candidateId] = round1(curVal + canAdd);
            bonusRemain = round1(bonusRemain - canAdd);
          }

          // 4. Giữa kỳ & Cuối kỳ (Tuyệt đối không cộng điểm thưởng vào đây)
          const midE = studentScores.find(e => e.scoreType === 'GIUA_KY' && e.semester === semesterSetting.semester);
          const finE = studentScores.find(e => e.scoreType === 'CUOI_KY' && e.semester === semesterSetting.semester);
          const midterm = (midE && midE.score !== null) ? midE.score : null;
          const finalScore = (finE && finE.score !== null) ? finE.score : null;

          // 5. Cột thường xuyên tham gia tính trung bình
          const validRegular = [];
          conversionColumns.forEach(cc => {
            if (cc.scoreType === 'CHUYEN_DE') {
              if (hasSpecial && semesterSetting.calculateSpecialTopic && convMap[cc.id] !== null) {
                validRegular.push(convMap[cc.id]);
              }
            } else if (convMap[cc.id] !== null) {
              validRegular.push(convMap[cc.id]);
            }
          });

          // TBHK: (Tổng TX + GK*2 + CK*3) / (Số TX + 5)
          let tbhk = null;
          if (midterm !== null && finalScore !== null && validRegular.length > 0) {
            const sumReg = validRegular.reduce((a, b) => a + b, 0);
            tbhk = round2((sumReg + midterm * 2 + finalScore * 3) / (validRegular.length + 5));
          }

          // TBCN: (TBHK1 + TBHK2 * 2) / 3 (Chỉ hiển thị tại HK2)
          let tbcn = null;
          if (semesterSetting.semester === 'HK2') {
            const hk1Fin = studentScores.find(e => e.semester === 'HK1' && e.scoreType === 'CUOI_KY');
            const fakeHk1 = (hk1Fin && hk1Fin.score !== null) ? hk1Fin.score : tbhk;
            if (fakeHk1 !== null && tbhk !== null) {
              tbcn = round2((fakeHk1 + tbhk * 2) / 3);
            }
          }

          return {
            studentId: student.id,
            orderNumber: student.orderNumber,
            studentCode: student.studentCode,
            fullName: student.fullName,
            convMap,
            midterm,
            finalScore,
            tbhk,
            tbcn
          };
        });
      }, [students, scoreEntries, scoreColumns, conversionColumns, conversionMappings, appliedImprovements, appliedBonuses, semesterSetting, classes, selectedClassId]);

      // Xuất file Excel SheetJS
      const handleDownloadExcel = () => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const headers = ['STT', 'Mã HS', 'Họ và tên'];
        conversionColumns.forEach(c => headers.push(c.name));
        headers.push('Giữa kỳ (x2)', 'Cuối kỳ (x3)', 'TBHK');
        if (semesterSetting.semester === 'HK2') headers.push('TBCN');

        const rows = tableCalculations.map((st, idx) => {
          const r = [st.orderNumber || (idx + 1), st.studentCode, st.fullName];
          conversionColumns.forEach(c => r.push(formatScore(st.convMap[c.id])));
          r.push(formatScore(st.midterm), formatScore(st.finalScore), formatScore(st.tbhk));
          if (semesterSetting.semester === 'HK2') r.push(formatScore(st.tbcn));
          return r;
        });

        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `BangDiem_${semesterSetting.semester}`);
        XLSX.writeFile(wb, `BangDiem_${curClass ? curClass.name : 'Lop'}_${semesterSetting.semester}.xlsx`);
        setExcelPreviewOpen(false);
      };

      return (
        <div>
          {/* Header */}
          <header>
            <h1>SỔ ĐIỂM ĐIỆN TỬ & QUẢN LÝ LỚP HỌC</h1>
            <div className="header-actions">
              {currentUser ? (
                <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                  <span style={{ fontSize: '0.85rem', fontWeight: 600 }}>{currentUser.email}</span>
                  <button className="btn btn-sm btn-danger" onClick={handleLogout}>Đăng xuất</button>
                </div>
              ) : (
                <button className="btn btn-sm btn-success" onClick={() => setLoginModalOpen(true)}>Đăng nhập Giáo Viên</button>
              )}
            </div>
          </header>

          {/* Sub-bar cài đặt Học kỳ (Chỉ hiển thị cho giáo viên đã đăng nhập) */}
          {currentUser && (
            <div>
              <div className="sub-bar">
                <div className="sub-bar-group">
                  <span>Học kỳ hoạt động:</span>
                  <button 
                    className={`btn btn-sm ${semesterSetting.semester === 'HK1' ? 'btn-primary' : 'btn-outline'}`}
                    onClick={() => handleSaveSemesterSetting('HK1', semesterSetting.calculateSpecialTopic)}
                  >
                    Học kỳ 1
                  </button>
                  <button 
                    className={`btn btn-sm ${semesterSetting.semester === 'HK2' ? 'btn-primary' : 'btn-outline'}`}
                    onClick={() => handleSaveSemesterSetting('HK2', semesterSetting.calculateSpecialTopic)}
                  >
                    Học kỳ 2
                  </button>
                </div>

                <div className="sub-bar-group">
                  <span>Tính chuyên đề trong kỳ:</span>
                  <button 
                    className={`btn btn-sm ${semesterSetting.calculateSpecialTopic ? 'btn-success' : 'btn-outline'}`}
                    onClick={() => handleSaveSemesterSetting(semesterSetting.semester, true)}
                  >
                    BẬT
                  </button>
                  <button 
                    className={`btn btn-sm ${!semesterSetting.calculateSpecialTopic ? 'btn-warning' : 'btn-outline'}`}
                    onClick={() => handleSaveSemesterSetting(semesterSetting.semester, false)}
                  >
                    TẮT
                  </button>
                </div>

                <div className="sub-bar-group">
                  <span>Lớp đang chọn:</span>
                  <select 
                    className="form-control" 
                    style={{ width: 160, padding: '4px 8px' }} 
                    value={selectedClassId} 
                    onChange={(e) => setSelectedClassId(e.target.value)}
                  >
                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
              </div>

              {/* Thanh điều hướng chính của Giáo viên */}
              <div className="nav-bar">
                <button className={currentTab === 'DASHBOARD' ? 'active' : ''} onClick={() => setCurrentTab('DASHBOARD')}>Bảng điều khiển</button>
                <button className={currentTab === 'SCORES' ? 'active' : ''} onClick={() => setCurrentTab('SCORES')}>Bảng điểm & Cột điểm</button>
                <button className={currentTab === 'GROUPS' ? 'active' : ''} onClick={() => setCurrentTab('GROUPS')}>Nhóm & Điểm nhóm</button>
                <button className={currentTab === 'RANDOM' ? 'active' : ''} onClick={() => setCurrentTab('RANDOM')}>Random học sinh</button>
                <button className={currentTab === 'CLASSES' ? 'active' : ''} onClick={() => setCurrentTab('CLASSES')}>Quản lý lớp & HS</button>
                <button className={currentTab === 'LOOKUP' ? 'active' : ''} onClick={() => setCurrentTab('LOOKUP')}>Tra cứu điểm</button>
              </div>
            </div>
          )}

          {}
          <div className="container">

            {/* CHẾ ĐỘ DÀNH CHO KHÁCH (CHƯA ĐĂNG NHẬP): CHỈ HIỂN THỊ DUY NHẤT MÀN HÌNH TRA CỨU */}
            {!currentUser && (
              <div className="card" style={{ maxWidth: 840, margin: '40px auto' }}>
                <div className="card-title" style={{ fontSize: '1.25rem', textAlign: 'center', justifyContent: 'center' }}>
                  TRA CỨU KẾT QUẢ ĐIỂM & LỊCH SỬ HỌC TẬP
                </div>
                <p style={{ textAlign: 'center', fontSize: '0.9rem', color: 'var(--text-muted)', marginBottom: 24 }}>
                  Học sinh và phụ huynh nhập chính xác Mã học sinh (Ví dụ: HS001) để xem chi tiết bảng điểm và lịch sử.
                </p>
                <PublicLookupView semesterSetting={semesterSetting} />
              </div>
            )}

            {/* CHẾ ĐỘ DÀNH CHO GIÁO VIÊN: BẢNG ĐIỀU KHIỂN (DASHBOARD) */}
            {currentUser && currentTab === 'DASHBOARD' && (
              <div>
                <div className="grid-4">
                  <div className="card text-center">
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Tổng số lớp</div>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--primary)' }}>{classes.length}</div>
                  </div>
                  <div className="card text-center">
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Số HS lớp hiện tại</div>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--primary)' }}>{students.length}</div>
                  </div>
                  <div className="card text-center">
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Học kỳ hoạt động</div>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--success)' }}>{semesterSetting.semester}</div>
                  </div>
                  <div className="card text-center">
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Tính chuyên đề</div>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: semesterSetting.calculateSpecialTopic ? 'var(--success)' : 'var(--danger)' }}>
                      {semesterSetting.calculateSpecialTopic ? 'BẬT' : 'TẮT'}
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">HỆ THỐNG ĐÃ SẴN SÀNG HOẠT ĐỘNG</div>
                  <p style={{ lineHeight: 1.6, fontSize: '0.9rem', color: '#334155' }}>
                    Tài khoản <strong>{currentUser.email}</strong> đang có toàn quyền quản trị: Thêm/Sửa/Xóa lớp học, tạo nhóm với snapshot bất biến, chuyển đổi loại cột điểm mà không mất dữ liệu, random học sinh không trùng lặp, nhập điểm chuỗi/bảng và xuất bảng điểm Excel kèm bản xem trước.
                  </p>
                </div>
              </div>
            )}

            {/* BẢNG ĐIỂM & QUẢN LÝ CỘT ĐIỂM */}
            {currentUser && currentTab === 'SCORES' && (
              <div>
                <div className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <span style={{ fontWeight: 600 }}>Thao tác nâng cao:</span>
                      <button className="btn btn-outline btn-sm" onClick={() => setImprovementModal(true)}>Điểm cải thiện</button>
                      <button className="btn btn-outline btn-sm" onClick={() => setBonusModal(true)}>Điểm cộng</button>
                    </div>

                    <button className="btn btn-primary btn-sm" onClick={() => setExcelPreviewOpen(true)}>
                      Xem trước & Xuất Excel
                    </button>
                  </div>
                </div>

                {/* Tạo cột điểm mới */}
                <div className="card">
                  <div className="card-title">TẠO CỘT ĐIỂM MỚI CHO LỚP</div>
                  <form onSubmit={handleCreateColumn} className="grid-3" style={{ alignItems: 'flex-end' }}>
                    <div className="form-group">
                      <label>Tên cột điểm:</label>
                      <input 
                        type="text" 
                        required 
                        className="form-control" 
                        placeholder="VD: Kiểm tra 15 phút lần 1" 
                        value={newColName}

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setGroupScoreModal(false)}>Hủy</button>
                  <button className="btn btn-primary" onClick={handleSaveGroupScore}>Lưu điểm nhóm</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: ĐIỂM CẢI THIỆN */}
          {improvementModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div className="modal-header">
                  <h3>Thiết lập điểm cải thiện</h3>
                  <button className="modal-close" onClick={() => setImprovementModal(false)}>×</button>
                </div>
                <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: 12 }}>
                  Điểm cải thiện sẽ thay thế điểm 0 hoặc cộng gộp theo trọng số vào cột thường xuyên quy đổi thấp nhất.
                </p>
                <div className="form-group" style={{ maxWidth: 200 }}>
                  <label>Trọng số cải thiện (%):</label>
                  <input 
                    type="number" 
                    min="1" 
                    max="100" 
                    className="form-control" 
                    value={improvementWeight} 
                    onChange={(e) => setImprovementWeight(parseInt(e.target.value) || 30)} 
                  />
                </div>
                <div style={{ maxHeight: 300, overflowY: 'auto', marginBottom: 16 }}>
                  <table>
                    <thead>
                      <tr><th>STT</th><th>Mã HS</th><th>Họ tên</th><th>Điểm bài cải thiện</th></tr>
                    </thead>
                    <tbody>
                      {students.map(st => (
                        <tr key={st.id}>
                          <td>{st.orderNumber}</td>
                          <td>{st.studentCode}</td>
                          <td>{st.fullName}</td>
                          <td>
                            <input 
                              type="text" 
                              className="form-control"
                              style={{ padding: '4px 8px', width: 100 }}
                              placeholder="0 - 10"
                              value={improvementDraftScores[st.id] || ''}
                              onChange={(e) => setImprovementDraftScores({ ...improvementDraftScores, [st.id]: e.target.value })}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setImprovementModal(false)}>Đóng</button>
                  <button className="btn btn-primary" onClick={() => {
                    const newApplied = {};
                    Object.keys(improvementDraftScores).forEach(sid => {
                      const val = parseFloat(improvementDraftScores[sid].replace(',', '.'));
                      if (!isNaN(val) && val >= 0 && val <= 10) {
                        newApplied[sid] = { score: round1(val), weight: improvementWeight };
                      }
                    });
                    setAppliedImprovements(newApplied);
                    setImprovementModal(false);
                  }}>Áp dụng</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: ĐIỂM CỘNG */}
          {bonusModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div className="modal-header">
                  <h3>Thiết lập điểm cộng (Chỉ cộng vào điểm TX)</h3>
                  <button className="modal-close" onClick={() => setBonusModal(false)}>×</button>
                </div>
                <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: 12 }}>
                  1% = 0.1đ | 2.5% = 0.25đ | 5% = 0.5đ | 7.5% = 0.75đ | 10% = 1.0đ. Phân bổ tuần tự từ cột thấp nhất, tuyệt đối không cộng vào GK hay CK.
                </p>
                <div style={{ maxHeight: 300, overflowY: 'auto', marginBottom: 16 }}>
                  <table>
                    <thead>
                      <tr><th>STT</th><th>Mã HS</th><th>Họ tên</th><th>Điểm cộng thêm</th></tr>
                    </thead>
                    <tbody>
                      {students.map(st => (
                        <tr key={st.id}>
                          <td>{st.orderNumber}</td>
                          <td>{st.studentCode}</td>
                          <td>{st.fullName}</td>
                          <td>
                            <div style={{ display: 'flex', gap: 6 }}>
                              {[0.25, 0.5, 0.75, 1.0].map(pts => (
                                <button 
                                  key={pts} 
                                  className={`btn btn-sm ${(appliedBonuses[st.id] === pts) ? 'btn-success' : 'btn-outline'}`}
                                  onClick={() => setAppliedBonuses({ ...appliedBonuses, [st.id]: pts })}
                                >
                                  +{pts}đ
                                </button>
                              ))}
                              {appliedBonuses[st.id] && (
                                <button className="btn btn-sm btn-danger" onClick={() => {
                                  const c = { ...appliedBonuses };
                                  delete c[st.id];
                                  setAppliedBonuses(c);
                                }}>Xóa</button>
                              )}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-primary" onClick={() => setBonusModal(false)}>Hoàn tất</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: XEM TRƯỚC BẢNG ĐIỂM EXCEL */}
          {excelPreviewOpen && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div className="modal-header">
                  <h3>XEM TRƯỚC BẢNG ĐIỂM XUẤT EXCEL ({semesterSetting.semester})</h3>
                  <button className="modal-close" onClick={() => setExcelPreviewOpen(false)}>×</button>
                </div>
                <div style={{ maxHeight: 380, overflowY: 'auto', marginBottom: 16 }}>
                  <table>
                    <thead>
                      <tr>
                        <th>STT</th><th>Mã HS</th><th>Họ tên</th>
                        {conversionColumns.map(c => <th key={c.id}>{c.name}</th>)}
                        <th>Giữa kỳ</th><th>Cuối kỳ</th><th>TBHK</th>
                        {semesterSetting.semester === 'HK2' && <th>TBCN</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {tableCalculations.map(st => (
                        <tr key={st.studentId}>
                          <td>{st.orderNumber}</td><td>{st.studentCode}</td><td>{st.fullName}</td>
                          {conversionColumns.map(c => <td key={c.id}>{formatScore(st.convMap[c.id])}</td>)}
                          <td>{formatScore(st.midterm)}</td><td>{formatScore(st.finalScore)}</td>
                          <td style={{ fontWeight: 600 }}>{formatScore(st.tbhk)}</td>
                          {semesterSetting.semester === 'HK2' && (
                            <td style={{ fontWeight: 600 }}>{formatScore(st.tbcn)}</td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setExcelPreviewOpen(false)}>Quay lại chỉnh sửa</button>
                  <button className="btn btn-success" onClick={handleDownloadExcel}>Xác nhận xuất Excel</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // GIAO DIỆN TRA CỨU ĐIỂM CÔNG KHAI DÀNH CHO KHÁCH & HỌC SINH
    function PublicLookupView({ semesterSetting }) {
      const [lookupCode, setLookupCode] = useState('');
      const [searching, setSearching] = useState(false);
      const [studentData, setStudentData] = useState(null);
      const [historyRows, setHistoryRows] = useState([]);
      const [msg, setMsg] = useState('');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!lookupCode.trim()) return;

        setSearching(true);
        setMsg('');
        setStudentData(null);
        setHistoryRows([]);

        try {
          const db = firebase.firestore();
          const qCode = lookupCode.trim().toUpperCase();

          const stSnap = await db.collection('students').where('studentCode', '==', qCode).get();
          if (stSnap.empty) {
            setMsg('Không tìm thấy học sinh với mã: ' + qCode);
            setSearching(false);
            return;
          }

          const st = stSnap.docs[0].data();
          setStudentData(st);

          const hSnap = await db.collection('scoreHistory').where('studentCode', '==', qCode).get();
          const list = [];
          hSnap.forEach(d => list.push(d.data()));
          list.sort((a, b) => b.timestamp - a.timestamp);
          setHistoryRows(list);
        } catch (err) {
          setMsg('Lỗi tra cứu: ' + err.message);
        } finally {
          setSearching(false);
        }
      };

      return (
        <div>
          <form onSubmit={handleSearch} style={{ display: 'flex', gap: 10, marginBottom: 20 }}>
            <input 
              type="text" 
              required 
              className="form-control" 
              placeholder="Nhập mã học sinh (VD: HS001)" 
              value={lookupCode} 
              onChange={(e) => setLookupCode(e.target.value)} 
              style={{ maxWidth: 320 }}
            />
            <button type="submit" className="btn btn-primary" disabled={searching}>
              {searching ? 'Đang tra cứu...' : 'Tra cứu ngay'}
            </button>
          </form>

          {msg && <div style={{ color: 'var(--danger)', fontSize: '0.9rem', marginBottom: 12 }}>{msg}</div>}

          {studentData && (
            <div>
              <div style={{ background: '#f1f5f9', padding: 16, borderRadius: 8, marginBottom: 20 }}>
                <div style={{ fontSize: '1.05rem', fontWeight: 700, color: 'var(--primary)' }}>{studentData.fullName}</div>
                <div style={{ fontSize: '0.85rem', color: '#475569', marginTop: 4 }}>
                  Mã học sinh: <strong>{studentData.studentCode}</strong> | STT trong lớp: <strong>{studentData.orderNumber}</strong>
                </div>
              </div>

              <h4 style={{ fontSize: '0.95rem', marginBottom: 10, color: 'var(--primary)' }}>LỊCH SỬ NHẬP ĐIỂM CỦA HỌC SINH</h4>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Thời gian</th>
                      <th>Học kỳ</th>
                      <th>Loại điểm</th>
                      <th>Cột điểm</th>
                      <th>Điểm</th>
                      <th>Ghi chú & Trạng thái</th>
                    </tr>
                  </thead>
                  <tbody>
                    {historyRows.length === 0 ? (
                      <tr><td colSpan={6} className="text-center">Chưa có bản ghi điểm nào được lưu</td></tr>
                    ) : (
                      historyRows.map((r, i) => (
                        <tr key={i}>
                          <td>{new Date(r.timestamp).toLocaleDateString('vi-VN')}</td>
                          <td>{r.semester || '-'}</td>
                          <td><span className="badge badge-primary">{r.scoreType || '-'}</span></td>
                          <td>{r.scoreColumnName || '-'}</td>
                          <td style={{ fontWeight: 700, color: 'var(--primary)' }}>{formatScore(r.newScore)}</td>
                          <td>
                            {r.participationStatus === 'KHONG_THAM_GIA' ? (
                              <span style={{ color: 'var(--danger)', fontWeight: 600 }}>Không tham gia nhóm (0 điểm)</span>
                            ) : (
                              r.reason || 'Bình thường'
                            )}
                            {r.groupSnapshot && ` [Nhóm: ${r.groupSnapshot.groupName}]`}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
