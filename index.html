<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Quản Lý Lớp Học, Điểm Số & Đánh Giá Học Sinh</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <!-- SheetJS (XLSX) -->

  <!-- Firebase Compat v10 CDN -->

<body>

  <!-- KHỞI TẠO FIREBASE COMPAT DUY NHẤT -->
  <script>
    const firebaseConfig = {

      authDomain: "sodiemonline.firebaseapp.com",
      projectId: "sodiemonline",
      storageBucket: "sodiemonline.firebasestorage.app",

    if (!firebase.apps.length) {

  <!-- ỨNG DỤNG REACT VÀ BABEL -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const round1 = (val) => (val === null || val === undefined || isNaN(val)) ? null : Math.round(val * 10) / 10;
    const round2 = (val) => (val === null || val === undefined || isNaN(val)) ? null : Math.round(val * 100) / 100;
    const formatScore = (val) => (val === null || val === undefined || isNaN(val)) ? '-' : val.toString().replace('.', ',');

    const getClassification = (score) => {
      if (score === null || score === undefined || isNaN(score)) return '-';
      if (score >= 9.0) return 'Xuất sắc';
      if (score >= 8.0) return 'Tốt';
      if (score >= 6.5) return 'Khá';
      if (score >= 5.0) return 'Đạt';
      return 'Chưa đạt';
    };

    const getClassificationBadgeClass = (rank) => {
      switch (rank) {
        case 'Xuất sắc': return 'bg-purple-100 text-purple-800 border-purple-200';
        case 'Tốt': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        case 'Khá': return 'bg-blue-100 text-blue-800 border-blue-200';
        case 'Đạt': return 'bg-amber-100 text-amber-800 border-amber-200';
        case 'Chưa đạt': return 'bg-rose-100 text-rose-800 border-rose-200';
        default: return 'bg-slate-100 text-slate-600 border-slate-200';
      }
    };

    const normalizeScoreType = (type) => {
      if (type === 'THUONG_XUYEN_BAO_TRUOC' || type === 'TX1') return 'TX1';
      if (type === 'DIEM_NHOM' || type === 'TX2') return 'TX2';
      if (type === 'THUONG_XUYEN_CA_NHAN' || type === 'TX3') return 'TX3';
      if (type === 'THUONG_XUYEN_DOT_XUAT' || type === 'TXDX') return 'TXDX';
      if (type === 'CHUYEN_DE') return 'CHUYEN_DE';
      if (type === 'GIUA_KY') return 'GIUA_KY';
      if (type === 'CUOI_KY') return 'CUOI_KY';
      return type;
    };

    const getScoreTypeLabel = (type) => {
      const n = normalizeScoreType(type);
      switch(n) {
        case 'TX1': return 'TX1 (Báo trước)';
        case 'TX2': return 'TX2 (Điểm nhóm)';
        case 'TX3': return 'TX3 (Cá nhân)';
        case 'TXDX': return 'TXDX (Đột xuất)';
        case 'CHUYEN_DE': return 'Chuyên đề';
        case 'GIUA_KY': return 'Giữa kỳ';
        case 'CUOI_KY': return 'Cuối kỳ';
        default: return type;
      }
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState('GUEST');
      const [authLoading, setAuthLoading] = useState(true);
      const [currentTab, setCurrentTab] = useState('DASHBOARD');

      const [semesterSetting, setSemesterSetting] = useState({ semester: 'HK1', calculateSpecialTopic: false });
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [scoreColumns, setScoreColumns] = useState([]);
      const [scoreEntries, setScoreEntries] = useState([]);
      const [bonusDeductions, setBonusDeductions] = useState([]);
      const [scoreHistories, setScoreHistories] = useState([]);

      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [randomSelectedClassId, setRandomSelectedClassId] = useState('');
      const [randomCount, setRandomCount] = useState(1);
      const [randomResults, setRandomResults] = useState([]);

      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
      const [excelPreviewOpen, setExcelPreviewOpen] = useState(false);

      const [bonusModal, setBonusModal] = useState({ isOpen: false, type: 'BONUS', reason: '', selections: {} });
      const [moveColModal, setMoveColModal] = useState({ isOpen: false, column: null, targetType: 'TX1' });

      // Lắng nghe trạng thái đăng nhập
      useEffect(() => {
        const unsubscribe = window.fbAuth.onAuthStateChanged(async (user) => {
          if (user) {
            setCurrentUser(user);
            if (user.email === 'toapt989@gmail.com') {
              setUserRole('SUPER_ADMIN');
            } else {
              try {
                const uDoc = await window.fbDb.collection('users').doc(user.uid).get();
                setUserRole(uDoc.exists ? (uDoc.data().role || 'TEACHER') : 'TEACHER');
              } catch (e) {
                setUserRole('TEACHER');
              }
            }
          } else {
            setCurrentUser(null);
            setUserRole('GUEST');
            setCurrentTab('LOOKUP');
          }
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // Lấy cấu hình học kỳ chung và danh sách lớp theo giáo viên
      const fetchTeacherData = async () => {
        if (!currentUser) return;
        try {
          const sDoc = await window.fbDb.collection('semesterSettings').doc('GLOBAL_CONFIG').get();
          if (sDoc.exists) {
            setSemesterSetting(sDoc.data());
          }

          let cQuery = window.fbDb.collection('classes');
          if (userRole !== 'SUPER_ADMIN') {
            cQuery = cQuery.where('teacherId', '==', currentUser.uid);
          }
          const cSnap = await cQuery.get();
          const list = [];
          cSnap.forEach(d => list.push({ id: d.id, ...d.data() }));
          setClasses(list);

          if (list.length > 0) {
            const currentSelectedExists = list.some(c => c.id === selectedClassId);
            const activeId = currentSelectedExists ? selectedClassId : list[0].id;
            setSelectedClassId(activeId);
            setRandomSelectedClassId(activeId);
          } else {
            setSelectedClassId('');
            setRandomSelectedClassId('');
          }
        } catch (err) {
          console.error("Lỗi nạp danh sách lớp:", err);
        }
      };

      useEffect(() => {
        if (currentUser) {
          fetchTeacherData();
        }
      }, [currentUser, userRole]);

      // Nạp dữ liệu chi tiết của lớp học được chọn
      const fetchClassData = async (classId) => {
        if (!classId || !currentUser) return;
        try {
          const [stSnap, grpSnap, colSnap, scSnap, bnSnap, hsSnap] = await Promise.all([
            window.fbDb.collection('students').where('classId', '==', classId).get(),
            window.fbDb.collection('groups').where('classId', '==', classId).get(),
            window.fbDb.collection('scoreColumns').where('classId', '==', classId).get(),
            window.fbDb.collection('scoreEntries').where('classId', '==', classId).get(),
            window.fbDb.collection('bonusDeductionEntries').where('classId', '==', classId).get(),
            window.fbDb.collection('scoreHistory').where('classId', '==', classId).get()
          ]);

          const stList = [];
          stSnap.forEach(d => stList.push({ id: d.id, ...d.data() }));
          stList.sort((a, b) => (Number(a.orderNumber) || 0) - (Number(b.orderNumber) || 0));
          setStudents(stList);

          const grpList = [];
          grpSnap.forEach(d => grpList.push({ id: d.id, ...d.data() }));
          setGroups(grpList);

          const colList = [];
          colSnap.forEach(d => colList.push({ id: d.id, ...d.data() }));
          setScoreColumns(colList);

          const scList = [];
          scSnap.forEach(d => scList.push({ id: d.id, ...d.data() }));
          setScoreEntries(scList);

          const bnList = [];
          bnSnap.forEach(d => bnList.push({ id: d.id, ...d.data() }));
          bnList.sort((a, b) => b.timestamp - a.timestamp);
          setBonusDeductions(bnList);

          const hsList = [];
          hsSnap.forEach(d => hsList.push({ id: d.id, ...d.data() }));
          hsList.sort((a, b) => b.timestamp - a.timestamp);
          setScoreHistories(hsList);

        } catch (err) {
          console.error("Lỗi nạp dữ liệu chi tiết lớp:", err);
        }
      };

      useEffect(() => {
        if (selectedClassId) {
          fetchClassData(selectedClassId);
        } else {
          setStudents([]);
          setGroups([]);
          setScoreColumns([]);
          setScoreEntries([]);
          setBonusDeductions([]);
          setScoreHistories([]);
        }
      }, [selectedClassId]);

      // Xử lý xác thực
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await window.fbAuth.signInWithEmailAndPassword(loginEmail.trim(), loginPass);
          setCurrentTab('DASHBOARD');
        } catch (err) {
          setLoginError('Đăng nhập không thành công: ' + (err.message || 'Vui lòng kiểm tra lại'));
        }
      };

      const handleLogout = async () => {
        await window.fbAuth.signOut();
        setCurrentTab('LOOKUP');
      };

      const handleSaveSemesterConfig = async (newSem, calcSpecial) => {
        if (!currentUser) return;
        const payload = { semester: newSem, calculateSpecialTopic: calcSpecial, updatedAt: Date.now() };
        await window.fbDb.collection('semesterSettings').doc('GLOBAL_CONFIG').set(payload, { merge: true });
        setSemesterSetting(payload);
      };

      // Đổi loại cột điểm gốc (Bảo toàn điểm số)
      const handleMoveScoreColumn = async () => {
        if (!moveColModal.column || !currentUser) return;
        const col = moveColModal.column;
        const newType = moveColModal.targetType;
        try {
          const batch = window.fbDb.batch();
          const colRef = window.fbDb.collection('scoreColumns').doc(col.id);
          batch.update(colRef, { type: newType });

          const relatedEntries = scoreEntries.filter(e => e.scoreColumnId === col.id);
          relatedEntries.forEach(entry => {
            const eRef = window.fbDb.collection('scoreEntries').doc(entry.id);
            batch.update(eRef, { scoreType: newType });
          });

          const hRef = window.fbDb.collection('scoreHistory').doc();
          batch.set(hRef, {
            id: hRef.id,
            classId: selectedClassId,
            teacherId: currentUser.uid,
            createdBy: currentUser.uid,
            scoreColumnName: col.name,
            reason: `Chuyển loại cột điểm từ ${getScoreTypeLabel(col.type)} sang ${getScoreTypeLabel(newType)}`,
            timestamp: Date.now(),
            participationStatus: 'KHONG_AP_DUNG'
          });

          await batch.commit();
          setMoveColModal({ isOpen: false, column: null, targetType: 'TX1' });
          fetchClassData(selectedClassId);
        } catch (err) {
          alert('Lỗi khi chuyển loại cột: ' + err.message);
        }
      };

      // Xóa cột điểm gốc đồng bộ
      const handleDeleteScoreColumn = (col) => {
        setConfirmModal({
          isOpen: true,
          title: `Xác nhận xóa cột điểm: ${col.name}`,
          message: 'Hành động này sẽ xóa toàn bộ điểm số của học sinh trong cột này và xóa sạch lịch sử liên quan để không hiển thị khi tra cứu. Bạn có chắc chắn muốn xóa?',
          onConfirm: async () => {
            try {
              const batch = window.fbDb.batch();
              batch.delete(window.fbDb.collection('scoreColumns').doc(col.id));

              const relatedEntries = scoreEntries.filter(e => e.scoreColumnId === col.id);
              relatedEntries.forEach(e => {
                batch.delete(window.fbDb.collection('scoreEntries').doc(e.id));
              });

              const relatedHistories = scoreHistories.filter(h => h.scoreColumnId === col.id || h.scoreColumnName === col.name);
              relatedHistories.forEach(h => {
                batch.delete(window.fbDb.collection('scoreHistory').doc(h.id));
              });

              await batch.commit();
              setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
              fetchClassData(selectedClassId);
            } catch (err) {
              alert('Lỗi khi xóa cột điểm: ' + err.message);
            }
          }
        });
      };

      // Lưu điểm cộng / trừ
      const handleSaveBonusDeduction = async () => {
        if (!bonusModal.reason.trim()) {
          alert('Vui lòng nhập lý do cụ thể');
          return;
        }
        const hasSelection = Object.values(bonusModal.selections).some(val => Number(val) > 0);
        if (!hasSelection) {
          alert('Vui lòng chọn mức điểm cho ít nhất một học sinh');
          return;
        }

        try {
          const batch = window.fbDb.batch();
          const now = Date.now();
          const sign = bonusModal.type === 'BONUS' ? 1 : -1;

          students.forEach(st => {
            const rawVal = Number(bonusModal.selections[st.id] || 0);
            if (rawVal > 0) {
              const pointValue = round2(rawVal * sign);
              const bRef = window.fbDb.collection('bonusDeductionEntries').doc();
              batch.set(bRef, {
                id: bRef.id,
                classId: selectedClassId,
                teacherId: currentUser.uid,
                createdBy: currentUser.uid,
                studentId: st.id,
                studentCode: st.studentCode,
                fullName: st.fullName,
                semester: semesterSetting.semester,
                type: bonusModal.type,
                points: pointValue,
                reason: bonusModal.reason.trim(),
                timestamp: now
              });

              const hRef = window.fbDb.collection('scoreHistory').doc();
              batch.set(hRef, {
                id: hRef.id,
                classId: selectedClassId,
                teacherId: currentUser.uid,
                createdBy: currentUser.uid,
                studentId: st.id,
                studentCode: st.studentCode,
                semester: semesterSetting.semester,
                scoreType: bonusModal.type === 'BONUS' ? 'DIEM_CONG' : 'DIEM_TRU',
                scoreColumnName: bonusModal.type === 'BONUS' ? 'Điểm cộng' : 'Điểm trừ',
                newScore: pointValue,
                reason: bonusModal.reason.trim(),
                participationStatus: 'KHONG_AP_DUNG',
                timestamp: now,
                bonusEntryId: bRef.id
              });
            }
          });

          await batch.commit();
          setBonusModal({ isOpen: false, type: 'BONUS', reason: '', selections: {} });
          fetchClassData(selectedClassId);
        } catch (err) {
          alert('Lỗi lưu điểm cộng/trừ: ' + err.message);
        }
      };

      // Xóa điểm cộng / trừ kèm lịch sử
      const handleDeleteBonusEntry = (entry) => {
        setConfirmModal({
          isOpen: true,
          title: 'Xác nhận xóa bản ghi điểm cộng/trừ',
          message: `Học sinh: ${entry.fullName} | Mức: ${entry.points > 0 ? '+' : ''}${entry.points}đ | Lý do: ${entry.reason}. Lịch sử tương ứng sẽ được tự động xóa hoàn toàn.`,
          onConfirm: async () => {
            try {
              const batch = window.fbDb.batch();
              batch.delete(window.fbDb.collection('bonusDeductionEntries').doc(entry.id));

              const relatedHistories = scoreHistories.filter(h => h.bonusEntryId === entry.id);
              relatedHistories.forEach(h => {
                batch.delete(window.fbDb.collection('scoreHistory').doc(h.id));
              });

              await batch.commit();
              setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
              fetchClassData(selectedClassId);
            } catch (err) {
              alert('Lỗi khi xóa bản ghi: ' + err.message);
            }
          }
        });
      };

      // Xử lý Random học sinh
      const handleExecuteRandom = async () => {
        if (!randomSelectedClassId) {
          alert('Vui lòng chọn lớp');
          return;
        }
        let pool = [];
        if (randomSelectedClassId === selectedClassId) {
          pool = [...students];
        } else {
          const snap = await window.fbDb.collection('students').where('classId', '==', randomSelectedClassId).get();
          snap.forEach(d => pool.push({ id: d.id, ...d.data() }));
        }

        if (pool.length === 0) {
          alert('Lớp chưa có học sinh nào');
          setRandomResults([]);
          return;
        }

        const count = Math.min(Math.max(1, parseInt(randomCount) || 1), pool.length);
        const shuffled = [...pool];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        setRandomResults(shuffled.slice(0, count));
      };

      // BẢNG TÍNH ĐIỂM TỔNG HỢP CỦA LỚP ĐANG CHỌN
      const calculatedClassData = useMemo(() => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const hasSpecial = curClass ? Boolean(curClass.hasSpecialTopic) : true;
        const currentSem = semesterSetting.semester;

        return students.map(st => {
          const stEntries = scoreEntries.filter(e => e.studentId === st.id);

          const getSingleAverage = (type, sem) => {
            const cols = scoreColumns.filter(c => normalizeScoreType(c.type) === type && (sem ? c.semester === sem : true));
            if (cols.length === 0) return null;
            const validScores = [];
            cols.forEach(col => {
              const ent = stEntries.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                validScores.push(Number(ent.score));
              }
            });
            if (validScores.length === 0) return null;
            const sum = validScores.reduce((a, b) => a + b, 0);
            return round1(sum / validScores.length);
          };

          const computeSemesterDetails = (sem) => {
            const tx1 = getSingleAverage('TX1', sem);
            const tx2 = getSingleAverage('TX2', sem);
            const tx3Base = getSingleAverage('TX3', sem);
            const txdx = getSingleAverage('TXDX', sem);

            let tx3 = null;
            if (tx3Base !== null && txdx !== null) {
              const suddenWeight = curClass && curClass.suddenWeight !== undefined ? Number(curClass.suddenWeight) : 30;
              tx3 = round1((txdx * (suddenWeight / 100)) + (tx3Base * ((100 - suddenWeight) / 100)));
            } else if (tx3Base !== null) {
              tx3 = tx3Base;
            } else if (txdx !== null) {
              tx3 = txdx;
            }

            const specialTopicScore = getSingleAverage('CHUYEN_DE', null);

            const midCol = scoreColumns.find(c => normalizeScoreType(c.type) === 'GIUA_KY' && c.semester === sem);
            const finalCol = scoreColumns.find(c => normalizeScoreType(c.type) === 'CUOI_KY' && c.semester === sem);

            const midEntry = midCol ? stEntries.find(e => e.scoreColumnId === midCol.id) : null;
            const finalEntry = finalCol ? stEntries.find(e => e.scoreColumnId === finalCol.id) : null;

            const mid = midEntry && midEntry.score !== null ? Number(midEntry.score) : null;
            const final = finalEntry && finalEntry.score !== null ? Number(finalEntry.score) : null;

            let weightedNumerator = 0;
            let weightedDenominator = 0;
            let hasAny = false;

            if (tx1 !== null) { weightedNumerator += tx1 * 1; weightedDenominator += 1; hasAny = true; }
            if (tx2 !== null) { weightedNumerator += tx2 * 1; weightedDenominator += 1; hasAny = true; }
            if (tx3 !== null) { weightedNumerator += tx3 * 1; weightedDenominator += 1; hasAny = true; }

            if (sem === 'HK2' && hasSpecial && specialTopicScore !== null) {
              weightedNumerator += specialTopicScore * 1;
              weightedDenominator += 1;
              hasAny = true;
            }

            if (mid !== null) { weightedNumerator += mid * 2; weightedDenominator += 2; hasAny = true; }
            if (final !== null) { weightedNumerator += final * 3; weightedDenominator += 3; hasAny = true; }

            const tbhk = (hasAny && weightedDenominator > 0) ? round2(weightedNumerator / weightedDenominator) : null;
            const rank = getClassification(tbhk);

            return { tx1, tx2, tx3, specialTopicScore, mid, final, tbhk, rank, hasAny };
          };

          const hk1 = computeSemesterDetails('HK1');
          const hk2 = computeSemesterDetails('HK2');

          let tbcn = null;
          let annualRank = '-';
          if (hk1.tbhk !== null && hk2.tbhk !== null) {
            tbcn = round2((hk1.tbhk + hk2.tbhk * 2) / 3);
            annualRank = getClassification(tbcn);
          }

          const currentDetails = currentSem === 'HK1' ? hk1 : hk2;

          return {
            id: st.id,
            orderNumber: st.orderNumber,
            studentCode: st.studentCode,
            fullName: st.fullName,
            currentSem,
            ...currentDetails,
            hk1,
            hk2,
            tbcn,
            annualRank
          };
        });
      }, [students, scoreColumns, scoreEntries, classes, selectedClassId, semesterSetting]);

      // XUẤT EXCEL
      const handleExecuteExportExcel = () => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const headers = ['STT', 'Mã HS', 'Họ và tên', 'TX1 (QĐ)', 'TX2 (QĐ)', 'TX3 (QĐ)'];
        if (curClass && curClass.hasSpecialTopic) headers.push('Chuyên đề');
        headers.push('Giữa kỳ (x2)', 'Cuối kỳ (x3)', 'TBHK');
        if (semesterSetting.semester === 'HK2') headers.push('TBCN');

        const rows = calculatedClassData.map(st => {
          const r = [st.orderNumber, st.studentCode, st.fullName];

    // COMPONENT: TRA CỨU ĐIỂM CÔNG KHAI ĐẦY ĐỦ CẢ 2 HỌC KỲ VÀ CẢ NĂM
    function PublicLookupView({ classes }) {
      const [lookupCode, setLookupCode] = useState('');
      const [searching, setSearching] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [studentResult, setStudentResult] = useState(null);

      const executeLookup = async (e) => {
        e.preventDefault();
        const code = lookupCode.trim().toUpperCase();
        if (!code) return;

        setSearching(true);
        setErrorMsg('');
        setStudentResult(null);

        try {
          // 1. Tìm thông tin học sinh
          let studentDoc = null;
          const snap1 = await window.fbDb.collection('students').where('studentCode', '==', code).limit(1).get();
          if (!snap1.empty) {
            studentDoc = snap1.docs[0];
          } else {
            const snap2 = await window.fbDb.collection('students').where('studentCode', '==', lookupCode.trim()).limit(1).get();
            if (!snap2.empty) studentDoc = snap2.docs[0];
          }

          if (!studentDoc) {
            setErrorMsg('Không tìm thấy học sinh với mã tra cứu: ' + code);
            setSearching(false);
            return;
          }

          const stData = { id: studentDoc.id, ...studentDoc.data() };

          // 2. Tải an toàn các dữ liệu liên quan qua Promise.allSettled
          const [clsRes, grpRes, colRes, entRes, bnRes, hisRes] = await Promise.allSettled([
            window.fbDb.collection('classes').doc(stData.classId).get(),
            window.fbDb.collection('groups').where('classId', '==', stData.classId).get(),
            window.fbDb.collection('scoreColumns').where('classId', '==', stData.classId).get(),
            window.fbDb.collection('scoreEntries').where('studentCode', '==', code).get(),
            window.fbDb.collection('bonusDeductionEntries').where('studentCode', '==', code).get(),
            window.fbDb.collection('scoreHistory').where('studentCode', '==', code).get()
          ]);

          const className = (clsRes.status === 'fulfilled' && clsRes.value.exists) 
            ? clsRes.value.data().name 
            : (stData.className || stData.classId);

          let groupName = 'Chưa phân nhóm';
          if (grpRes.status === 'fulfilled') {
            grpRes.value.forEach(d => {
              const g = d.data();
              if (g.memberStudentIds && (g.memberStudentIds.includes(stData.id) || g.memberStudentIds.includes(code))) {
                groupName = g.name;
              }
            });
          }

          const scoreCols = colRes.status === 'fulfilled' ? colRes.value.docs.map(d => ({ id: d.id, ...d.data() })) : [];
          const scoreEnts = entRes.status === 'fulfilled' ? entRes.value.docs.map(d => ({ id: d.id, ...d.data() })) : [];
          const bonusEntries = bnRes.status === 'fulfilled' ? bnRes.value.docs.map(d => ({ id: d.id, ...d.data() })) : [];
          const historyRows = hisRes.status === 'fulfilled' ? hisRes.value.docs.map(d => ({ id: d.id, ...d.data() })) : [];
          historyRows.sort((a, b) => b.timestamp - a.timestamp);

          // 3. Tính bảng điểm chi tiết cho cả HK1 và HK2
          const getAvg = (type, sem) => {
            const cols = scoreCols.filter(c => normalizeScoreType(c.type) === type && (sem ? c.semester === sem : true));
            if (cols.length === 0) return null;
            const valid = [];
            cols.forEach(c => {
              const ent = scoreEnts.find(e => e.scoreColumnId === c.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) valid.push(Number(ent.score));
            });
            if (valid.length === 0) return null;
            return round1(valid.reduce((a, b) => a + b, 0) / valid.length);
          };

          const computeSem = (sem) => {
            const tx1 = getAvg('TX1', sem);
            const tx2 = getAvg('TX2', sem);
            const tx3Base = getAvg('TX3', sem);
            const txdx = getAvg('TXDX', sem);
            let tx3 = null;
            if (tx3Base !== null && txdx !== null) {
              tx3 = round1((txdx * 0.3) + (tx3Base * 0.7));
            } else if (tx3Base !== null) {
              tx3 = tx3Base;
            } else if (txdx !== null) {
              tx3 = txdx;
            }

            const sp = getAvg('CHUYEN_DE', null);
            const midCol = scoreCols.find(c => normalizeScoreType(c.type) === 'GIUA_KY' && c.semester === sem);
            const finalCol = scoreCols.find(c => normalizeScoreType(c.type) === 'CUOI_KY' && c.semester === sem);

            const midEnt = midCol ? scoreEnts.find(e => e.scoreColumnId === midCol.id) : null;
            const finalEnt = finalCol ? scoreEnts.find(e => e.scoreColumnId === finalCol.id) : null;

            const mid = midEnt && midEnt.score !== null ? Number(midEnt.score) : null;
            const final = finalEnt && finalEnt.score !== null ? Number(finalEnt.score) : null;

            let num = 0;
            let den = 0;
            let hasAny = false;

            if (tx1 !== null) { num += tx1 * 1; den += 1; hasAny = true; }
            if (tx2 !== null) { num += tx2 * 1; den += 1; hasAny = true; }
            if (tx3 !== null) { num += tx3 * 1; den += 1; hasAny = true; }
            if (sem === 'HK2' && sp !== null) { num += sp * 1; den += 1; hasAny = true; }
            if (mid !== null) { num += mid * 2; den += 2; hasAny = true; }
            if (final !== null) { num += final * 3; den += 3; hasAny = true; }

            const tbhk = (hasAny && den > 0) ? round2(num / den) : null;
            const rank = getClassification(tbhk);

            return { tx1, tx2, tx3, sp, mid, final, tbhk, rank, hasAny };
          };

          const hk1 = computeSem('HK1');
          const hk2 = computeSem('HK2');

          let tbcn = null;
          let annualRank = '-';
          if (hk1.tbhk !== null && hk2.tbhk !== null) {
            tbcn = round2((hk1.tbhk + hk2.tbhk * 2) / 3);
            annualRank = getClassification(tbcn);
          }

          setStudentResult({
            student: stData,
            className,
            groupName,
            hk1,
            hk2,
            tbcn,
            annualRank,
            historyRows
          });

        } catch (err) {
          setErrorMsg('Lỗi truy vấn bảng điểm: ' + err.message);
        } finally {
          setSearching(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
            <h2 className="text-sm font-bold text-blue-900 mb-3 border-b pb-2">
              TRA CỨU KẾT QUẢ HỌC TẬP VÀ BẢNG ĐIỂM
            </h2>
            <form onSubmit={executeLookup} className="flex gap-2">
              <input 
                type="text" 
                placeholder="Nhập mã học sinh tra cứu (ví dụ: HS001)..."
                className="flex-1 p-2.5 border border-slate-300 rounded text-xs uppercase focus:ring-1 focus:ring-blue-600"
                value={lookupCode}
                onChange={(e) => setLookupCode(e.target.value)}
              />
              <button 
                type="submit" 
                disabled={searching}
                className="px-5 py-2.5 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded text-xs shadow transition disabled:opacity-50"
              >
                {searching ? 'Đang tìm kiếm...' : 'Tra cứu'}
              </button>
            </form>

            {errorMsg && (
              <div className="mt-3 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded text-xs">
                {errorMsg}
              </div>
            )}
          </div>

          {studentResult && (
            <div className="space-y-6">
              
              {/* Thẻ thông tin học sinh */}
              <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                  <div>
                    <span className="text-slate-500 font-medium">Họ và tên:</span>
                    <div className="text-sm font-bold text-slate-800">{studentResult.student.fullName}</div>
                  </div>
                  <div>
                    <span className="text-slate-500 font-medium">Mã học sinh:</span>
                    <div className="text-sm font-bold text-blue-800">{studentResult.student.studentCode}</div>
                  </div>
                  <div>
                    <span className="text-slate-500 font-medium">Lớp học:</span>
                    <div className="text-sm font-bold text-slate-800">{studentResult.className}</div>
                  </div>
                  <div>
                    <span className="text-slate-500 font-medium">Nhóm hiện tại:</span>
                    <div className="text-sm font-bold text-slate-800">{studentResult.groupName}</div>
                  </div>
                </div>
              </div>

              {/* BẢNG ĐIỂM ĐẦY ĐỦ CẢ 2 HỌC KỲ */}
              <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-xs font-bold text-blue-900 uppercase tracking-wider">
                  BẢNG ĐIỂM TỔNG HỢP (HỌC KỲ 1 & HỌC KỲ 2)
                </h3>
                <div className="overflow-x-auto custom-scroll">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-100 text-slate-700">
                        <th className="p-2.5 border">Học kỳ</th>
                        <th className="p-2.5 border">TX1 (QĐ)</th>
                        <th className="p-2.5 border">TX2 (QĐ)</th>
                        <th className="p-2.5 border">TX3 (QĐ)</th>
                        <th className="p-2.5 border">Chuyên đề (chỉ tính HK2)</th>
                        <th className="p-2.5 border">Giữa kỳ (x2)</th>
                        <th className="p-2.5 border">Cuối kỳ (x3)</th>
                        <th className="p-2.5 border bg-amber-50 text-amber-900">TBHK</th>
                        <th className="p-2.5 border text-center">Xếp loại</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td className="p-2.5 border font-bold bg-slate-50">Học kỳ 1</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk1.tx1)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk1.tx2)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk1.tx3)}</td>
                        <td className="p-2.5 border text-slate-400">Không tính HK1</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk1.mid)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk1.final)}</td>
                        <td className="p-2.5 border font-bold bg-amber-50 text-amber-900">
                          {studentResult.hk1.tbhk !== null ? formatScore(studentResult.hk1.tbhk) : 'Chưa có cột điểm nào'}
                        </td>
                        <td className="p-2.5 border text-center">
                          <span className={`px-2 py-0.5 rounded border text-[11px] font-bold ${getClassificationBadgeClass(studentResult.hk1.rank)}`}>
                            {studentResult.hk1.rank}
                          </span>
                        </td>
                      </tr>
                      <tr>
                        <td className="p-2.5 border font-bold bg-slate-50">Học kỳ 2</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk2.tx1)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk2.tx2)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk2.tx3)}</td>
                        <td className="p-2.5 border font-semibold text-blue-900">
                          {formatScore(studentResult.hk2.sp)}
                        </td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk2.mid)}</td>
                        <td className="p-2.5 border">{formatScore(studentResult.hk2.final)}</td>
                        <td className="p-2.5 border font-bold bg-amber-50 text-amber-900">
                          {studentResult.hk2.tbhk !== null ? formatScore(studentResult.hk2.tbhk) : 'Chưa có cột điểm nào'}
                        </td>
                        <td className="p-2.5 border text-center">
                          <span className={`px-2 py-0.5 rounded border text-[11px] font-bold ${getClassificationBadgeClass(studentResult.hk2.rank)}`}>
                            {studentResult.hk2.rank}
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* Kết quả Cả năm */}
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div>
                    <span className="text-emerald-900 font-semibold">Điểm trung bình cả năm (TBCN):</span>
                    <strong className="text-base text-emerald-800 ml-2">
                      {studentResult.tbcn !== null ? formatScore(studentResult.tbcn) : 'Chưa đủ điều kiện 2 học kỳ'}
                    </strong>
                  </div>
                  <div>
                    <span className="text-emerald-900 font-semibold">Xếp loại cả năm:</span>
                    <span className={`ml-2 px-2.5 py-1 rounded border text-xs font-black ${getClassificationBadgeClass(studentResult.annualRank)}`}>
                      {studentResult.annualRank}
                    </span>
                  </div>
                </div>
              </div>

              {/* LỊCH SỬ ĐIỂM CHI TIẾT */}
              <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-xs font-bold text-blue-900 uppercase tracking-wider">
                  NHẬT KÝ VÀ LỊCH SỬ ĐIỂM CỦA HỌC SINH
                </h3>
                <div className="overflow-x-auto custom-scroll">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-100 text-slate-700">
                        <th className="p-2.5 border">Thời gian</th>
                        <th className="p-2.5 border">Học kỳ</th>
                        <th className="p-2.5 border">Loại điểm</th>
                        <th className="p-2.5 border">Cột điểm</th>
                        <th className="p-2.5 border">Điểm ghi nhận</th>
                        <th className="p-2.5 border">Ghi chú</th>
                      </tr>
                    </thead>
                    <tbody>
                      {studentResult.historyRows.length === 0 ? (
                        <tr><td colSpan="6" className="p-4 text-center text-slate-400 border">Chưa có bản ghi lịch sử điểm nào</td></tr>
                      ) : (
                        studentResult.historyRows.map((h, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="p-2.5 border text-slate-500">{new Date(h.timestamp).toLocaleDateString('vi-VN')}</td>
                            <td className="p-2.5 border">{h.semester || '-'}</td>
                            <td className="p-2.5 border">
                              <span className="px-2 py-0.5 bg-slate-100 text-slate-800 rounded font-semibold text-[11px]">
                                {getScoreTypeLabel(h.scoreType)}
                              </span>
                            </td>
                            <td className="p-2.5 border">{h.scoreColumnName || '-'}</td>
                            <td className="p-2.5 border font-bold">{formatScore(h.newScore)}</td>
                            <td className="p-2.5 border">
                              {h.participationStatus === 'KHONG_THAM_GIA' ? (
                                <span className="text-rose-600 font-semibold">Vắng mặt (0 điểm)</span>
                              ) : (
                                h.reason || 'Bình thường'
                              )}
                              {h.groupSnapshot && ` [${h.groupSnapshot.groupName}]`}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Khởi tạo icon Lucide
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 300);
  </script>
</body>
</html>
