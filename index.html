<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Cấu hình Firebase sodiemonline
    const firebaseConfig = {
      apiKey: "AIzaSyBKI6CPLt3M159K9GdD0GUVfDIAaYzemvg",
      authDomain: "sodiemonline.firebaseapp.com",
      projectId: "sodiemonline",
      storageBucket: "sodiemonline.firebasestorage.app",
      messagingSenderId: "928218267233",
      appId: "1:928218267233:web:889914f0ebcbf529eeb420",
      measurementId: "G-LEF5EWHC11"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Hàm tiện ích làm tròn và định dạng
    const round1 = (val) => (val === null || val === undefined || isNaN(val) ? null : Math.round(val * 10) / 10);
    const round2 = (val) => (val === null || val === undefined || isNaN(val) ? null : Math.round(val * 100) / 100);
    const formatScore = (val) => (val === null || val === undefined || isNaN(val) ? '-' : val.toString().replace('.', ','));

    // Đổi tên nhãn ngắn gọn theo yêu cầu
    const SCORE_TYPE_LABELS = {
      THUONG_XUYEN_BAO_TRUOC: 'TX1',
      DIEM_NHOM: 'TX2',
      THUONG_XUYEN_CA_NHAN: 'TX3',
      THUONG_XUYEN_DOT_XUAT: 'TXDX',
      CHUYEN_DE: 'Chuyên đề',
      GIUA_KY: 'Giữa kỳ',
      CUOI_KY: 'Cuối kỳ',
      DIEM_CONG: 'Điểm cộng',
      DIEM_TRU: 'Điểm trừ',
      DIEM_CAI_THIEN: 'Điểm cải thiện'
    };

    const getScoreTypeLabel = (type) => SCORE_TYPE_LABELS[type] || type;

    const getAcademicRank = (score) => {
      if (score === null || score === undefined || isNaN(score)) return '-';
      if (score >= 9.0) return 'Xuất sắc';
      if (score >= 8.0) return 'Tốt';
      if (score >= 6.5) return 'Khá';
      if (score >= 5.0) return 'Đạt';
      return 'Chưa đạt';
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('DASHBOARD');

      // Modal đăng nhập
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loggingIn, setLoggingIn] = useState(false);

      // Cài đặt học kỳ
      const [semesterSetting, setSemesterSetting] = useState({
        semester: 'HK1',
        calculateSpecialTopic: false
      });

      // Dữ liệu lớp học
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [scoreColumns, setScoreColumns] = useState([]);
      const [scoreEntries, setScoreEntries] = useState([]);
      const [scoreHistory, setScoreHistory] = useState([]);
      const [bonusDeductions, setBonusDeductions] = useState([]);

      // Cấu hình tỉ trọng cột điểm & TXDX
      const [columnWeights, setColumnWeights] = useState({});
      const [draftWeights, setDraftWeights] = useState({});
      const [suddenWeight, setSuddenWeight] = useState(20);
      const [draftSuddenWeight, setDraftSuddenWeight] = useState(20);

      // Modal xác nhận
      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        onConfirm: null
      });

      const triggerConfirm = (title, message, onConfirm) => {
        setConfirmModal({ isOpen: true, title, message, onConfirm });
      };

      // Modal tạo lớp / nhập HS
      const [classModalOpen, setClassModalOpen] = useState(false);
      const [classNameInput, setClassNameInput] = useState('');
      const [classHasSpecialTopic, setClassHasSpecialTopic] = useState(false);
      const [studentImportModalOpen, setStudentImportModalOpen] = useState(false);
      const [studentImportText, setStudentImportText] = useState('');

      // Modal tạo cột điểm mới
      const [createColModalOpen, setCreateColModalOpen] = useState(false);
      const [newColName, setNewColName] = useState('');
      const [newColType, setNewColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // Modal chuyển loại cột điểm
      const [moveColModalOpen, setMoveColModalOpen] = useState(false);
      const [colToMove, setColToMove] = useState(null);
      const [targetColType, setTargetColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // Modal nhập điểm chuỗi
      const [stringScoreModalOpen, setStringScoreModalOpen] = useState(false);
      const [stringScoreTargetCol, setStringScoreTargetCol] = useState(null);
      const [stringScoreInput, setStringScoreInput] = useState('');
      const [stringScorePreview, setStringScorePreview] = useState(null);
      const [stringScoreError, setStringScoreError] = useState('');

      // Modal nhập điểm bảng
      const [tableScoreModalOpen, setTableScoreModalOpen] = useState(false);
      const [tableScoreTargetCol, setTableScoreTargetCol] = useState(null);
      const [tableScoreDrafts, setTableScoreDrafts] = useState({});

      // Modal nhập điểm nhóm (TX2)
      const [groupScoreModalOpen, setGroupScoreModalOpen] = useState(false);
      const [selectedGroupId, setSelectedGroupId] = useState('');
      const [groupScoreTargetColId, setGroupScoreTargetColId] = useState('');
      const [groupScoreVal, setGroupScoreVal] = useState('');
      const [groupParticipations, setGroupParticipations] = useState({});

      // Modal quản lý nhóm
      const [groupManageModalOpen, setGroupManageModalOpen] = useState(false);
      const [newGroupName, setNewGroupName] = useState('');
      const [selectedStudentsForGroup, setSelectedStudentsForGroup] = useState([]);

      // Modal điểm cải thiện
      const [improvementModalOpen, setImprovementModalOpen] = useState(false);
      const [impStudentId, setImpStudentId] = useState('');
      const [impScore, setImpScore] = useState('');
      const [impWeight, setImpWeight] = useState(30);

      // Modal điểm cộng / điểm trừ
      const [bonusModalOpen, setBonusModalOpen] = useState(false);
      const [bonusActionType, setBonusActionType] = useState('DIEM_CONG');
      const [bonusReason, setBonusReason] = useState('');
      const [bonusStudentValues, setBonusStudentValues] = useState({});

      // Random học sinh
      const [randomClassId, setRandomClassId] = useState('');
      const [randomCount, setRandomCount] = useState(1);
      const [randomResults, setRandomResults] = useState([]);

      // Xuất Excel Preview
      const [excelPreviewOpen, setExcelPreviewOpen] = useState(false);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          setCurrentUser(user);
          setAuthLoading(false);
          if (user) {
            loadTeacherData(user.uid);
          } else {
            resetTeacherData();
          }
        });
        return () => unsubscribe();
      }, []);

      const resetTeacherData = () => {
        setClasses([]);
        setSelectedClassId('');
        setStudents([]);
        setGroups([]);
        setScoreColumns([]);
        setScoreEntries([]);
        setScoreHistory([]);
        setBonusDeductions([]);
      };

      const loadTeacherData = async (teacherId) => {
        try {
          // 1. Tải cài đặt học kỳ của riêng giáo viên
          const semRef = db.collection('semesterSettings').doc(teacherId);
          const semSnap = await semRef.get();
          if (semSnap.exists) {
            setSemesterSetting(semSnap.data());
          } else {
            const initialSem = { semester: 'HK1', calculateSpecialTopic: false };
            await semRef.set(initialSem);
            setSemesterSetting(initialSem);
          }

          // 2. Tải danh sách lớp của giáo viên
          const classSnap = await db.collection('classes').where('teacherId', '==', teacherId).get();
          const clsList = [];
          classSnap.forEach(d => clsList.push({ id: d.id, ...d.data() }));
          setClasses(clsList);

          if (clsList.length > 0) {
            const firstId = clsList[0].id;
            setSelectedClassId(firstId);
            setRandomClassId(firstId);
            loadClassData(firstId);
          }
        } catch (err) {
          console.error("Lỗi khi tải dữ liệu giáo viên:", err);
        }
      };

      const loadClassData = async (classId) => {
        if (!classId) return;
        try {
          const classDoc = await db.collection('classes').doc(classId).get();
          if (classDoc.exists) {
            const cdata = classDoc.data();
            const weights = cdata.weights || {};
            const sWeight = cdata.suddenWeight !== undefined ? cdata.suddenWeight : 20;
            setColumnWeights(weights);
            setDraftWeights(weights);
            setSuddenWeight(sWeight);
            setDraftSuddenWeight(sWeight);
          }

          // Lấy danh sách học sinh
          const stSnap = await db.collection('students').where('classId', '==', classId).get();
          const stList = [];
          stSnap.forEach(d => stList.push({ id: d.id, ...d.data() }));
          stList.sort((a, b) => a.orderNumber - b.orderNumber);
          setStudents(stList);

          // Lấy danh sách nhóm
          const grpSnap = await db.collection('groups').where('classId', '==', classId).get();
          const grpList = [];
          grpSnap.forEach(d => grpList.push({ id: d.id, ...d.data() }));
          setGroups(grpList);

          // Lấy danh sách cột điểm gốc
          const colSnap = await db.collection('scoreColumns').where('classId', '==', classId).get();
          const colList = [];
          colSnap.forEach(d => colList.push({ id: d.id, ...d.data() }));
          colList.sort((a, b) => a.createdAt - b.createdAt);
          setScoreColumns(colList);

          // Lấy bảng điểm entries
          const entrySnap = await db.collection('scoreEntries').where('classId', '==', classId).get();
          const entryList = [];
          entrySnap.forEach(d => entryList.push({ id: d.id, ...d.data() }));
          setScoreEntries(entryList);

          // Lấy lịch sử điểm
          const histSnap = await db.collection('scoreHistory').where('classId', '==', classId).get();
          const histList = [];
          histSnap.forEach(d => histList.push({ id: d.id, ...d.data() }));
          histList.sort((a, b) => b.timestamp - a.timestamp);
          setScoreHistory(histList);

          // Lấy điểm cộng / trừ
          const bdSnap = await db.collection('bonusDeductions').where('classId', '==', classId).get();
          const bdList = [];
          bdSnap.forEach(d => bdList.push({ id: d.id, ...d.data() }));
          setBonusDeductions(bdList);

        } catch (err) {
          console.error("Lỗi nạp dữ liệu lớp:", err);
        }
      };

      const handleSelectClass = (clsId) => {
        setSelectedClassId(clsId);
        loadClassData(clsId);
      };

      const updateSemesterConfig = async (newSem, newCalcSpecial) => {
        if (!currentUser) return;
        try {
          const payload = { semester: newSem, calculateSpecialTopic: newCalcSpecial };
          await db.collection('semesterSettings').doc(currentUser.uid).set(payload);
          setSemesterSetting(payload);
        } catch (err) {
          console.error("Lỗi cập nhật học kỳ:", err);
        }
      };

      // Đăng nhập / Đăng xuất
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoggingIn(true);
        try {
          await auth.signInWithEmailAndPassword(loginEmail, loginPassword);
          setLoginModalOpen(false);
          setLoginEmail('');
          setLoginPassword('');
        } catch (err) {
          let msg = 'Đăng nhập thất bại: ' + err.message;
          if (err.code === 'auth/wrong-password') msg = 'Mật khẩu không chính xác.';
          if (err.code === 'auth/user-not-found') msg = 'Tài khoản không tồn tại trên hệ thống.';
          if (err.code === 'auth/invalid-email') msg = 'Định dạng email không hợp lệ.';
          setLoginError(msg);
        } finally {
          setLoggingIn(false);
        }
      };

      const handleLogout = async () => {
        await auth.signOut();
        setActiveTab('DASHBOARD');
      };

      const tableCalculations = useMemo(() => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const hasSpecialTopic = curClass ? curClass.hasSpecialTopic : false;
        const curSem = semesterSetting.semester;

        const relevantCols = scoreColumns.filter(c => {
          if (c.type === 'CHUYEN_DE') return true;
          return c.semester === curSem;
        });

        const colsByType = {
          THUONG_XUYEN_BAO_TRUOC: relevantCols.filter(c => c.type === 'THUONG_XUYEN_BAO_TRUOC'),
          DIEM_NHOM: relevantCols.filter(c => c.type === 'DIEM_NHOM'),
          THUONG_XUYEN_CA_NHAN: relevantCols.filter(c => c.type === 'THUONG_XUYEN_CA_NHAN'),
          THUONG_XUYEN_DOT_XUAT: relevantCols.filter(c => c.type === 'THUONG_XUYEN_DOT_XUAT'),
          CHUYEN_DE: relevantCols.filter(c => c.type === 'CHUYEN_DE'),
          GIUA_KY: relevantCols.filter(c => c.type === 'GIUA_KY'),
          CUOI_KY: relevantCols.filter(c => c.type === 'CUOI_KY')
        };

        return students.map(student => {
          const stEntries = scoreEntries.filter(e => e.studentId === student.id);

          // 1. Tính quy đổi TX1 (Báo trước), TX2 (Nhóm), Chuyên đề
          const calculateStandardConverted = (type) => {
            const typeCols = colsByType[type] || [];
            if (typeCols.length === 0) return null;

            let totalWeight = 0;
            let weightedSum = 0;
            let countValid = 0;

            typeCols.forEach(col => {
              const entry = stEntries.find(e => e.scoreColumnId === col.id);
              if (entry && entry.score !== null && !isNaN(entry.score)) {
                const w = columnWeights[col.id] !== undefined ? columnWeights[col.id] : (100 / typeCols.length);
                weightedSum += entry.score * (w / 100);
                totalWeight += w;
                countValid++;
              }
            });

            if (countValid === 0 || totalWeight === 0) return null;
            return round1(weightedSum / (totalWeight / 100));
          };

          const tx1 = calculateStandardConverted('THUONG_XUYEN_BAO_TRUOC');
          const tx2 = calculateStandardConverted('DIEM_NHOM');
          const chuyenDe = hasSpecialTopic ? calculateStandardConverted('CHUYEN_DE') : null;

          // 2. Tính quy đổi TX3 hai lần (CN1 + TXDX)
          const tx3Cols = colsByType['THUONG_XUYEN_CA_NHAN'] || [];
          let cn1 = null;
          if (tx3Cols.length > 0) {
            let totalW = 0;
            let weightedSum = 0;
            let countValid = 0;
            tx3Cols.forEach(col => {
              const entry = stEntries.find(e => e.scoreColumnId === col.id);
              if (entry && entry.score !== null && !isNaN(entry.score)) {
                const w = columnWeights[col.id] !== undefined ? columnWeights[col.id] : (100 / tx3Cols.length);
                weightedSum += entry.score * (w / 100);
                totalW += w;
                countValid++;
              }
            });
            if (countValid > 0 && totalW > 0) {
              cn1 = weightedSum / (totalW / 100);
            }
          }

          // Trung bình các cột TXDX đã nhập (bỏ qua ô trống)
          const txdxCols = colsByType['THUONG_XUYEN_DOT_XUAT'] || [];
          let txdxAvg = null;
          if (txdxCols.length > 0) {
            let sum = 0;
            let count = 0;
            txdxCols.forEach(col => {
              const entry = stEntries.find(e => e.scoreColumnId === col.id);
              if (entry && entry.score !== null && !isNaN(entry.score)) {
                sum += entry.score;
                count++;
              }
            });
            if (count > 0) txdxAvg = sum / count;
          }

          let tx3 = null;
          if (cn1 !== null && txdxAvg !== null) {
            tx3 = round1((txdxAvg * (suddenWeight / 100)) + (cn1 * ((100 - suddenWeight) / 100)));
          } else if (cn1 !== null) {
            tx3 = round1(cn1);
          } else if (txdxAvg !== null) {
            tx3 = round1(txdxAvg);
          }

          // Giữa kỳ & Cuối kỳ
          const gkCols = colsByType['GIUA_KY'] || [];
          const ckCols = colsByType['CUOI_KY'] || [];
          let midterm = null;
          if (gkCols.length > 0) {
            const e = stEntries.find(ent => ent.scoreColumnId === gkCols[0].id);
            if (e && e.score !== null && !isNaN(e.score)) midterm = e.score;
          }
          let finalScore = null;
          if (ckCols.length > 0) {
            const e = stEntries.find(ent => ent.scoreColumnId === ckCols[0].id);
            if (e && e.score !== null && !isNaN(e.score)) finalScore = e.score;
          }

          // 3. Phân bổ điểm cộng / trừ tích lũy CHỈ vào các cột thường xuyên quy đổi
          const stBonusList = bonusDeductions.filter(b => b.studentId === student.id && b.semester === curSem);
          const totalBonusPoints = stBonusList
            .filter(b => b.type === 'DIEM_CONG')
            .reduce((acc, curr) => acc + (curr.points || 0), 0);
          const totalDeductionPoints = stBonusList
            .filter(b => b.type === 'DIEM_TRU')
            .reduce((acc, curr) => acc + (curr.points || 0), 0);
          const netBonus = round1(totalBonusPoints - totalDeductionPoints);

          const convertedMap = {
            THUONG_XUYEN_BAO_TRUOC: tx1,
            DIEM_NHOM: tx2,
            THUONG_XUYEN_CA_NHAN: tx3
          };
          if (hasSpecialTopic && semesterSetting.calculateSpecialTopic) {
            convertedMap['CHUYEN_DE'] = chuyenDe;
          }

          // Áp dụng điểm cộng/trừ vào cột TX có giá trị
          if (netBonus > 0) {
            let remainingBonus = netBonus;
            while (remainingBonus > 0) {
              let candidateKey = null;
              let minScore = 10;
              for (const [k, v] of Object.entries(convertedMap)) {
                if (v !== null && v < 10) {
                  if (candidateKey === null || v < minScore) {
                    minScore = v;
                    candidateKey = k;
                  }
                }
              }
              if (!candidateKey) break;
              const canAdd = Math.min(round1(10 - convertedMap[candidateKey]), remainingBonus);
              convertedMap[candidateKey] = round1(convertedMap[candidateKey] + canAdd);
              remainingBonus = round1(remainingBonus - canAdd);
            }
          } else if (netBonus < 0) {
            let remainingPenalty = Math.abs(netBonus);
            while (remainingPenalty > 0) {
              let candidateKey = null;
              let maxScore = -1;
              for (const [k, v] of Object.entries(convertedMap)) {
                if (v !== null && v > 0) {
                  if (candidateKey === null || v > maxScore) {
                    maxScore = v;
                    candidateKey = k;
                  }
                }
              }
              if (!candidateKey) break;
              const canSub = Math.min(convertedMap[candidateKey], remainingPenalty);
              convertedMap[candidateKey] = round1(convertedMap[candidateKey] - canSub);
              remainingPenalty = round1(remainingPenalty - canSub);
            }
          }

          // 4. Tính TBHK linh hoạt theo các cột thực tế ĐÃ CÓ ĐIỂM
          // TX quy đổi: hệ số 1, GK: hệ số 2, CK: hệ số 3
          let weightedSumAll = 0;
          let totalFactor = 0;

          Object.values(convertedMap).forEach(val => {
            if (val !== null) {
              weightedSumAll += val * 1;
              totalFactor += 1;
            }
          });

          if (midterm !== null) {
            weightedSumAll += midterm * 2;
            totalFactor += 2;
          }

          if (finalScore !== null) {
            weightedSumAll += finalScore * 3;
            totalFactor += 3;
          }

          let tbhk = null;
          if (totalFactor > 0) {
            tbhk = round2(weightedSumAll / totalFactor);
          }

          // 5. TBCN ở HK2: (TBHK1 + TBHK2 * 2) / 3
          let tbcn = null;
          if (curSem === 'HK2' && tbhk !== null) {
            const hk1Entry = stEntries.find(e => e.semester === 'HK1' && e.scoreType === 'CUOI_KY');
            const tbhk1 = hk1Entry && hk1Entry.score !== null ? hk1Entry.score : tbhk;
            tbcn = round2((tbhk1 + tbhk * 2) / 3);
          }

          return {
            studentId: student.id,
            orderNumber: student.orderNumber,
            studentCode: student.studentCode,
            fullName: student.fullName,
            convertedMap,
            midterm,
            finalScore,
            tbhk,
            tbcn,
            academicRankHK: getAcademicRank(tbhk),
            academicRankYear: getAcademicRank(tbcn),
            totalBonusPoints,
            totalDeductionPoints,
            netBonus
          };
        });
      }, [students, scoreColumns, scoreEntries, columnWeights, suddenWeight, bonusDeductions, semesterSetting, classes, selectedClassId]);

      const handleCreateClass = async (e) => {
        e.preventDefault();
        if (!classNameInput.trim() || !currentUser) return;
        try {
          const docRef = await db.collection('classes').add({
            name: classNameInput.trim(),
            teacherId: currentUser.uid,
            hasSpecialTopic: classHasSpecialTopic,
            weights: {},
            suddenWeight: 20,
            createdAt: Date.now()
          });
          const newClass = {

                          <td className="px-2 py-1.5 font-bold">{st.tbhk !== null ? formatScore(st.tbhk) : '-'}</td>
                          {semesterSetting.semester === 'HK2' && (
                            <td className="px-2 py-1.5 font-bold">{st.tbcn !== null ? formatScore(st.tbcn) : '-'}</td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setExcelPreviewOpen(false)} className="rounded bg-slate-200 px-4 py-2 text-xs font-semibold text-slate-700">Quay lại chỉnh sửa</button>
                  <button onClick={handleDownloadExcel} className="rounded bg-emerald-700 px-5 py-2 text-xs font-bold text-white hover:bg-emerald-800">
                    <i className="fa-solid fa-file-excel mr-1.5"></i> Xác nhận tạo & Tải file Excel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PublicLookupComponent({ semesterSetting }) {
      const [lookupCode, setLookupCode] = useState('');
      const [searching, setSearching] = useState(false);
      const [studentData, setStudentData] = useState(null);
      const [className, setClassName] = useState('');
      const [currentGroupName, setCurrentGroupName] = useState('Chưa phân nhóm');
      const [historyRows, setHistoryRows] = useState([]);
      const [msg, setMsg] = useState('');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!lookupCode.trim()) return;

        setSearching(true);
        setMsg('');
        setStudentData(null);
        setClassName('');
        setCurrentGroupName('Chưa phân nhóm');
        setHistoryRows([]);

        try {
          const qCode = lookupCode.trim().toUpperCase();
          const stSnap = await db.collection('students').where('studentCode', '==', qCode).get();

          if (stSnap.empty) {
            setMsg('Không tìm thấy học sinh với mã: ' + qCode);
            setSearching(false);
            return;
          }

          const stDoc = stSnap.docs[0];
          const st = { id: stDoc.id, ...stDoc.data() };
          setStudentData(st);

          let activeColsMap = new Map();

          // Lấy Tên lớp và Tên nhóm hiện tại chuẩn xác từ thẻ do giáo viên tạo
          if (st.classId) {
            const clsDoc = await db.collection('classes').doc(st.classId).get();
            if (clsDoc.exists) {
              setClassName(clsDoc.data().name || 'Chưa cập nhật');
            }

            const grpSnap = await db.collection('groups').where('classId', '==', st.classId).get();
            let matchedGroupName = 'Chưa phân nhóm';
            grpSnap.forEach(gd => {
              const gData = gd.data();
              if (gData.memberStudentIds && (gData.memberStudentIds.includes(st.id) || gData.memberStudentIds.includes(st.studentCode))) {
                matchedGroupName = gData.name;
              }
            });
            setCurrentGroupName(matchedGroupName);

            // Thu thập các cột điểm gốc ĐANG CÒN HIỆN DIỆN
            const activeColSnap = await db.collection('scoreColumns').where('classId', '==', st.classId).get();
            activeColSnap.forEach(cd => {
              const cdata = cd.data();
              activeColsMap.set(cd.id, cdata.name);
            });
          }

          const histSnap = await db.collection('scoreHistory').where('studentCode', '==', qCode).get();
          const allHist = [];
          histSnap.forEach(d => allHist.push(d.data()));
          allHist.sort((a, b) => b.timestamp - a.timestamp);

          const seenScoreColumns = new Set();
          const filteredRows = [];

          for (const row of allHist) {
            const isSpecial = row.scoreType === 'DIEM_CONG' || row.scoreType === 'DIEM_TRU' || row.scoreType === 'DIEM_CAI_THIEN' || row.reason?.includes('cải thiện');
            if (isSpecial) {
              // Điểm cộng, điểm trừ, điểm cải thiện hiển thị đầy đủ
              filteredRows.push(row);
            } else {
              // Bỏ qua các bản ghi thuộc về cột điểm gốc đã bị xóa
              if (row.scoreColumnId && !activeColsMap.has(row.scoreColumnId)) {
                continue;
              }
              const colName = row.scoreColumnName || activeColsMap.get(row.scoreColumnId);
              const key = `${row.semester || ''}_${colName || ''}`;
              // Chỉ hiển thị lần ghi nhận cuối cùng của mỗi cột điểm gốc
              if (!seenScoreColumns.has(key)) {
                seenScoreColumns.add(key);
                filteredRows.push({
                  ...row,
                  scoreColumnName: colName || row.scoreColumnName
                });
              }
            }
          }

          setHistoryRows(filteredRows);
        } catch (err) {
          setMsg('Lỗi tra cứu: ' + err.message);
        } finally {
          setSearching(false);
        }
      };

      return (
        <div>
          <form onSubmit={handleSearch} className="mb-6 flex gap-2">
            <input
              type="text"
              required
              className="w-full max-w-sm rounded border border-slate-300 px-3 py-2 text-xs focus:border-blue-600 focus:outline-none"
              placeholder="Nhập mã học sinh (VD: HS001)"
              value={lookupCode}
              onChange={(e) => setLookupCode(e.target.value)}
            />
            <button type="submit" disabled={searching} className="rounded bg-blue-700 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-800 disabled:opacity-50">
              {searching ? 'Đang tra cứu...' : 'Tra cứu ngay'}
            </button>
          </form>

          {msg && <div className="mb-4 rounded bg-rose-50 p-2.5 text-xs font-semibold text-rose-600 border border-rose-200">{msg}</div>}

          {studentData && (
            <div className="space-y-4">
              <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
                <div className="text-base font-bold text-blue-900">{studentData.fullName}</div>
                <div className="mt-2 flex flex-wrap gap-4 text-xs text-slate-600">
                  <span>Mã HS: <strong className="text-slate-800">{studentData.studentCode}</strong></span>
                  <span>STT: <strong className="text-slate-800">{studentData.orderNumber}</strong></span>
                  <span>Lớp: <strong className="text-blue-700">{className || 'Chưa cập nhật'}</strong></span>
                  <span>Nhóm hiện tại: <strong className="text-emerald-700">{currentGroupName}</strong></span>
                </div>
              </div>

              <div>
                <div className="mb-2 text-xs font-bold text-slate-800">
                  BẢNG ĐIỂM GHI NHẬN MỚI NHẤT & LỊCH SỬ ĐIỂM CỘNG/TRỪ/CẢI THIỆN
                </div>
                <p className="mb-2 text-xs text-slate-500">Mỗi cột điểm gốc hiện hữu hiển thị lần ghi nhận mới nhất. Lịch sử điểm cộng, điểm trừ và điểm cải thiện được lưu vết toàn diện.</p>
                <div className="overflow-x-auto rounded-lg border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-700">
                      <tr>
                        <th className="px-3 py-2">Thời gian</th>
                        <th className="px-3 py-2">Học kỳ</th>
                        <th className="px-3 py-2">Loại ghi nhận</th>
                        <th className="px-3 py-2">Cột điểm / Tác vụ</th>
                        <th className="px-3 py-2">Điểm / Mức</th>
                        <th className="px-3 py-2">Lý do & Chi tiết</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {historyRows.length === 0 ? (
                        <tr><td colSpan={6} className="px-3 py-4 text-center text-slate-400">Chưa có bản ghi điểm nào được lưu</td></tr>
                      ) : (
                        historyRows.map((r, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="px-3 py-2 font-medium text-slate-500">{new Date(r.timestamp).toLocaleDateString('vi-VN')}</td>
                            <td className="px-3 py-2">{r.semester || '-'}</td>
                            <td className="px-3 py-2">
                              <span className={`inline-block rounded px-2 py-0.5 text-xs font-semibold ${
                                r.scoreType === 'DIEM_CONG'
                                  ? 'bg-emerald-100 text-emerald-800'
                                  : r.scoreType === 'DIEM_TRU'
                                  ? 'bg-rose-100 text-rose-800'
                                  : r.scoreType === 'DIEM_CAI_THIEN' || r.reason?.includes('cải thiện')
                                  ? 'bg-indigo-100 text-indigo-800'
                                  : 'bg-blue-100 text-blue-800'
                              }`}>
                                {getScoreTypeLabel(r.scoreType)}
                              </span>
                            </td>
                            <td className="px-3 py-2 font-bold text-slate-800">{r.scoreColumnName || '-'}</td>
                            <td className={`px-3 py-2 font-black ${r.scoreType === 'DIEM_TRU' ? 'text-rose-600' : 'text-blue-700'}`}>
                              {r.scoreType === 'DIEM_CONG'
                                ? `+${r.newScore}đ`
                                : r.scoreType === 'DIEM_TRU'
                                ? `${r.newScore}đ`
                                : formatScore(r.newScore)}
                            </td>
                            <td className="px-3 py-2 text-slate-600">
                              {r.participationStatus === 'KHONG_THAM_GIA' ? (
                                <span className="font-bold text-rose-600">Không tham gia nhóm (0 điểm)</span>
                              ) : (
                                r.reason || 'Lần nhập mới nhất'
                              )}
                              {r.oldScore !== null && r.oldScore !== undefined && ` (Điểm trước: ${formatScore(r.oldScore)})`}
                              {r.groupSnapshot && ` [Nhóm: ${r.groupSnapshot.groupName}]`}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
