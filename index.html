<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sổ Điểm Điện Tử & Quản Lý Lớp Học</title>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBKI6CPLt3M159K9GdD0GUVfDIAaYzemvg",
      authDomain: "sodiemonline.firebaseapp.com",
      projectId: "sodiemonline",
      storageBucket: "sodiemonline.firebasestorage.app",
      messagingSenderId: "928218267233",
      appId: "1:928218267233:web:889914f0ebcbf529eeb420"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const round1 = (val) => (val === null || val === undefined || isNaN(val) ? null : Math.round(val * 10) / 10);
    const round2 = (val) => (val === null || val === undefined || isNaN(val) ? null : Math.round(val * 100) / 100);
    const formatScore = (val) => (val === null || val === undefined || isNaN(val) ? '-' : val.toString().replace('.', ','));

    const getAcademicRank = (score) => {
      if (score === null || score === undefined || isNaN(score)) return '-';
      if (score >= 9.0) return 'Xuất sắc';
      if (score >= 8.0) return 'Tốt';
      if (score >= 6.5) return 'Khá';
      if (score >= 5.0) return 'Đạt';
      return 'Chưa đạt';
    };

    const getRankBadge = (rank) => {
      switch (rank) {
        case 'Xuất sắc': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
        case 'Tốt': return 'bg-blue-100 text-blue-800 border-blue-300';
        case 'Khá': return 'bg-amber-100 text-amber-800 border-amber-300';
        case 'Đạt': return 'bg-slate-100 text-slate-700 border-slate-300';
        case 'Chưa đạt': return 'bg-rose-100 text-rose-800 border-rose-300';
        default: return 'bg-gray-100 text-gray-600 border-gray-200';
      }
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginModalOpen, setLoginModalOpen] = useState(false);

      const [currentTab, setCurrentTab] = useState('DASHBOARD');
      const [semesterSetting, setSemesterSetting] = useState({ semester: 'HK1', calculateSpecialTopic: false });
      
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [scoreColumns, setScoreColumns] = useState([]);
      const [scoreEntries, setScoreEntries] = useState([]);
      const [scoreHistories, setScoreHistories] = useState([]);
      const [bonusDeductionList, setBonusDeductionList] = useState([]);

      const [classWeights, setClassWeights] = useState({});
      const [draftWeights, setDraftWeights] = useState({});
      const [draftSuddenWeight, setDraftSuddenWeight] = useState(20);
      const [weightNotice, setWeightNotice] = useState({ type: '', msg: '' });

      const [newClassName, setNewClassName] = useState('');
      const [newClassSpecial, setNewClassSpecial] = useState(true);
      const [importRawStudents, setImportRawStudents] = useState('');
      const [importError, setImportError] = useState('');

      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupMembers, setSelectedGroupMembers] = useState([]);

      const [groupScoreModal, setGroupScoreModal] = useState(false);
      const [groupTargetCol, setGroupTargetCol] = useState(null);
      const [groupTargetGroup, setGroupTargetGroup] = useState(null);
      const [groupScoreInput, setGroupScoreInput] = useState('');
      const [groupMemberStatus, setGroupMemberStatus] = useState({});

      const [newColName, setNewColName] = useState('');
      const [newColType, setNewColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      const [moveColModal, setMoveColModal] = useState(false);
      const [colToMove, setColToMove] = useState(null);
      const [targetColType, setTargetColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      const [stringInputModal, setStringInputModal] = useState(false);
      const [activeColForString, setActiveColForString] = useState(null);
      const [rawScoreString, setRawScoreString] = useState('');
      const [stringParsedScores, setStringParsedScores] = useState(null);
      const [stringInputError, setStringInputError] = useState('');

      const [tableInputModal, setTableInputModal] = useState(false);
      const [activeColForTable, setActiveColForTable] = useState(null);
      const [tableDraftScores, setTableDraftScores] = useState({});

      const [bonusModalOpen, setBonusModalOpen] = useState(false);
      const [bonusActionType, setBonusActionType] = useState('PLUS');
      const [bonusReason, setBonusReason] = useState('');
      const [bonusSelections, setBonusSelections] = useState({});
      const [bonusNotice, setBonusNotice] = useState('');

      const [improvementModal, setImprovementModal] = useState(false);
      const [improvementWeight, setImprovementWeight] = useState(30);
      const [improvementDraftScores, setImprovementDraftScores] = useState({});
      const [appliedImprovements, setAppliedImprovements] = useState({});

      const [randomClassId, setRandomClassId] = useState('');
      const [randomCount, setRandomCount] = useState(1);
      const [randomResults, setRandomResults] = useState([]);

      const [excelPreviewOpen, setExcelPreviewOpen] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ open: false, title: '', message: '', onConfirm: null });

      const triggerConfirm = (title, message, onConfirm) => {
        setConfirmModal({
          open: true,
          title,
          message,
          onConfirm: async () => {
            setConfirmModal(prev => ({ ...prev, open: false }));
            if (onConfirm) await onConfirm();
          }
        });
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          setCurrentUser(user);
          setAuthLoading(false);
          if (user) {
            setCurrentTab('DASHBOARD');
          } else {
            setCurrentTab('LOOKUP');
          }
        });
        return () => unsubscribe();
      }, []);

      const loadTeacherConfigAndClasses = async (user) => {
        if (!user) return;
        try {
          const settingDoc = await db.collection('semesterSettings').doc('GLOBAL_CONFIG').get();
          if (settingDoc.exists) {
            setSemesterSetting(settingDoc.data());
          }

          let classQuery = db.collection('classes');
          if (user.email !== 'toapt989@gmail.com') {
            classQuery = classQuery.where('teacherId', '==', user.uid);
          }
          const snap = await classQuery.get();
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setClasses(list);

          if (list.length > 0) {
            const currentSelectedStillExists = list.some(c => c.id === selectedClassId);
            const targetId = currentSelectedStillExists ? selectedClassId : list[0].id;
            setSelectedClassId(targetId);
            setRandomClassId(targetId);
          } else {
            setSelectedClassId('');
            setRandomClassId('');
          }
        } catch (err) {
          console.error("Lỗi nạp danh sách lớp:", err);
        }
      };

      useEffect(() => {
        if (currentUser) {
          loadTeacherConfigAndClasses(currentUser);
        }
      }, [currentUser]);

      const loadClassData = async (classId) => {
        if (!classId || !currentUser) {
          setStudents([]);
          setGroups([]);
          setScoreColumns([]);
          setScoreEntries([]);
          setScoreHistories([]);
          setBonusDeductionList([]);
          return;
        }

        try {
          const isSuper = currentUser.email === 'toapt989@gmail.com';
          const teacherConstraint = (coll) => {
            let ref = db.collection(coll).where('classId', '==', classId);
            if (!isSuper) {
              ref = ref.where('teacherId', '==', currentUser.uid);
            }
            return ref;
          };

          const [stSnap, grpSnap, colSnap, entSnap, histSnap, bdSnap] = await Promise.all([
            teacherConstraint('students').get(),
            teacherConstraint('groups').get(),
            teacherConstraint('scoreColumns').get(),
            teacherConstraint('scoreEntries').get(),
            teacherConstraint('scoreHistory').get(),
            teacherConstraint('bonusDeductions').get()
          ]);

          const stList = [];
          stSnap.forEach(d => stList.push({ id: d.id, ...d.data() }));
          stList.sort((a, b) => a.orderNumber - b.orderNumber);
          setStudents(stList);

          const grpList = [];
          grpSnap.forEach(d => grpList.push({ id: d.id, ...d.data() }));
          setGroups(grpList);

          const colList = [];
          colSnap.forEach(d => colList.push({ id: d.id, ...d.data() }));
          setScoreColumns(colList);

          const entList = [];
          entSnap.forEach(d => entList.push({ id: d.id, ...d.data() }));
          setScoreEntries(entList);

          const histList = [];
          histSnap.forEach(d => histList.push({ id: d.id, ...d.data() }));
          histList.sort((a, b) => b.timestamp - a.timestamp);
          setScoreHistories(histList);

          const bdList = [];
          bdSnap.forEach(d => bdList.push({ id: d.id, ...d.data() }));
          setBonusDeductionList(bdList);

          const currentCls = classes.find(c => c.id === classId);
          let loadedWeights = currentCls?.weights || {};
          let loadedSudden = currentCls?.suddenWeight !== undefined ? currentCls.suddenWeight : 20;

          try {
            const localSaved = localStorage.getItem(`weights_${currentUser.uid}_${classId}`);
            if (localSaved) {
              const parsed = JSON.parse(localSaved);
              if (parsed.weights) loadedWeights = { ...loadedWeights, ...parsed.weights };
              if (parsed.suddenWeight !== undefined) loadedSudden = parsed.suddenWeight;
            }
          } catch (e) {}

          setClassWeights({ weights: loadedWeights, suddenWeight: loadedSudden });
          setDraftWeights(loadedWeights);
          setDraftSuddenWeight(loadedSudden);
        } catch (err) {
          console.error("Lỗi nạp dữ liệu lớp học:", err);
        }
      };

      useEffect(() => {
        if (selectedClassId && currentUser) {
          loadClassData(selectedClassId);
        }
      }, [selectedClassId, currentUser]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPass);
          setLoginModalOpen(false);
          setLoginEmail('');
          setLoginPass('');
        } catch (err) {
          setLoginError('Đăng nhập không thành công. Vui lòng kiểm tra lại email và mật khẩu.');
        }
      };

      const handleLogout = async () => {
        await auth.signOut();
        setCurrentTab('LOOKUP');
      };

      const handleSaveSemesterSetting = async (sem, calcSpecial) => {
        const payload = { semester: sem, calculateSpecialTopic: calcSpecial, updatedAt: Date.now() };
        try {
          await db.collection('semesterSettings').doc('GLOBAL_CONFIG').set(payload, { merge: true });
          setSemesterSetting(payload);
        } catch (e) {
          console.error("Lỗi cập nhật cấu hình học kỳ:", e);
        }
      };

      const handleCreateClass = async (e) => {
        e.preventDefault();
        if (!newClassName.trim() || !currentUser) return;
        try {
          const docRef = db.collection('classes').doc();
          const newCls = {
            id: docRef.id,
            name: newClassName.trim(),
            hasSpecialTopic: newClassSpecial,
            teacherId: currentUser.uid,
            createdBy: currentUser.email,
            weights: {},
            suddenWeight: 20,
            createdAt: Date.now()
          };
          await docRef.set(newCls);
          setNewClassName('');
          await loadTeacherConfigAndClasses(currentUser);
          setSelectedClassId(newCls.id);
        } catch (err) {
          console.error("Lỗi tạo lớp:", err);
        }
      };

      const handleDeleteClass = (classId) => {
        triggerConfirm(
          'Xác nhận xóa lớp học',
          'Bạn có chắc chắn muốn xóa lớp này? Toàn bộ danh sách học sinh, điểm số và nhóm liên quan của lớp sẽ bị xóa hoàn toàn.',
          async () => {
            try {
              const batch = db.batch();
              batch.delete(db.collection('classes').doc(classId));

              const [stSnap, grpSnap, colSnap, entSnap, histSnap, bdSnap] = await Promise.all([
                db.collection('students').where('classId', '==', classId).get(),
                db.collection('groups').where('classId', '==', classId).get(),
                db.collection('scoreColumns').where('classId', '==', classId).get(),
                db.collection('scoreEntries').where('classId', '==', classId).get(),
                db.collection('scoreHistory').where('classId', '==', classId).get(),
                db.collection('bonusDeductions').where('classId', '==', classId).get()
              ]);

              stSnap.forEach(d => batch.delete(d.ref));
              grpSnap.forEach(d => batch.delete(d.ref));
              colSnap.forEach(d => batch.delete(d.ref));
              entSnap.forEach(d => batch.delete(d.ref));
              histSnap.forEach(d => batch.delete(d.ref));
              bdSnap.forEach(d => batch.delete(d.ref));

              await batch.commit();
              await loadTeacherConfigAndClasses(currentUser);
            } catch (err) {
              console.error("Lỗi xóa lớp học:", err);
            }
          }
        );
      };

      const handleImportStudents = async (e) => {
        e.preventDefault();
        setImportError('');
        if (!importRawStudents.trim() || !selectedClassId || !currentUser) return;

        const lines = importRawStudents.trim().split('\n').filter(l => l.trim().length > 0);
        const parsed = [];
        const seenCodes = new Set();

        for (let i = 0; i < lines.length; i++) {
          const parts = lines[i].split(',').map(s => s.trim());
          if (parts.length !== 3) {
            setImportError(`Dòng ${i + 1} cần đúng cú pháp: STT,Mã HS,Họ và tên`);
            return;
          }
          const orderNum = parseInt(parts[0], 10);
          const code = parts[1].toUpperCase();
          const name = parts[2];

          if (isNaN(orderNum) || !code || !name) {
            setImportError(`Dòng ${i + 1} có dữ liệu không hợp lệ`);
            return;
          }
          if (seenCodes.has(code)) {
            setImportError(`Trùng lặp Mã HS ${code} tại dòng ${i + 1}`);
            return;
          }
          seenCodes.add(code);
          parsed.push({ orderNumber: orderNum, studentCode: code, fullName: name });
        }

        try {
          const batch = db.batch();
          parsed.forEach(st => {
            const ref = db.collection('students').doc(`${currentUser.uid}_${selectedClassId}_${st.studentCode}`);
            batch.set(ref, {
              id: ref.id,
              classId: selectedClassId,
              teacherId: currentUser.uid,
              orderNumber: st.orderNumber,
              studentCode: st.studentCode,
              fullName: st.fullName,
              createdAt: Date.now()
            });
          });
          await batch.commit();
          setImportRawStudents('');
          loadClassData(selectedClassId);
        } catch (err) {
          setImportError('Lỗi khi lưu danh sách học sinh: ' + err.message);
        }
      };

      const handleCreateColumn = async (e) => {
        e.preventDefault();
        if (!newColName.trim() || !selectedClassId || !currentUser) return;
        try {
          const colRef = db.collection('scoreColumns').doc();
          await colRef.set({
            id: colRef.id,
            classId: selectedClassId,
            teacherId: currentUser.uid,
            name: newColName.trim(),
            type: newColType,
            semester: semesterSetting.semester,
            createdAt: Date.now()
          });
          setNewColName('');
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi tạo cột điểm:", err);
        }
      };

      const handleDeleteColumn = (col) => {
        triggerConfirm(
          'Xác nhận xóa cột điểm gốc',
          `Bạn có chắc chắn muốn xóa cột "${col.name}"? Toàn bộ điểm số học sinh đã nhập trong cột này sẽ bị xóa bỏ hoàn toàn.`,
          async () => {
            try {
              const batch = db.batch();
              batch.delete(db.collection('scoreColumns').doc(col.id));

              const entries = scoreEntries.filter(e => e.scoreColumnId === col.id);
              entries.forEach(e => batch.delete(db.collection('scoreEntries').doc(e.id)));

              const histRef = db.collection('scoreHistory').doc();
              batch.set(histRef, {
                id: histRef.id,
                classId: selectedClassId,
                teacherId: currentUser.uid,
                studentId: 'ALL',
                studentCode: 'ALL',
                scoreColumnName: col.name,
                semester: col.semester || semesterSetting.semester,
                scoreType: col.type,
                oldScore: null,
                newScore: 0,
                participationStatus: 'KHONG_AP_DUNG',
                reason: `Đã xóa cột điểm ${col.name} (${col.type})`,
                timestamp: Date.now(),
                modifiedBy: currentUser.email
              });

              await batch.commit();
              loadClassData(selectedClassId);
            } catch (err) {
              console.error("Lỗi xóa cột điểm:", err);
            }
          }
        );
      };

      const handleExecuteChangeColumnType = async () => {
        if (!colToMove || !targetColType || !currentUser) return;
        try {
          const batch = db.batch();
          const colRef = db.collection('scoreColumns').doc(colToMove.id);
          batch.update(colRef, { type: targetColType });

          const entries = scoreEntries.filter(e => e.scoreColumnId === colToMove.id);
          entries.forEach(e => {
            const entryRef = db.collection('scoreEntries').doc(e.id);
            batch.update(entryRef, { scoreType: targetColType });
          });

          const histRef = db.collection('scoreHistory').doc();
          batch.set(histRef, {
            id: histRef.id,
            classId: selectedClassId,
            teacherId: currentUser.uid,
            studentId: 'ALL',
            studentCode: 'ALL',
            scoreColumnName: colToMove.name,
            semester: colToMove.semester || semesterSetting.semester,
            scoreType: targetColType,
            oldScore: null,
            newScore: 0,
            participationStatus: 'KHONG_AP_DUNG',
            reason: `Chuyển cột từ [${colToMove.type}] sang [${targetColType}]`,
            timestamp: Date.now(),
            modifiedBy: currentUser.email
          });

          await batch.commit();
          setMoveColModal(false);
          setColToMove(null);
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi chuyển loại cột điểm:", err);
        }
      };

      const handleSaveWeights = async () => {
        setWeightNotice({ type: '', msg: '' });
        const suddenVal = parseFloat(draftSuddenWeight);
        const finalSudden = isNaN(suddenVal) ? 20 : suddenVal;

        const currentSemCols = scoreColumns.filter(c => c.semester === semesterSetting.semester || c.type === 'CHUYEN_DE');
        const typesToCheck = ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN', 'CHUYEN_DE'];

        for (const type of typesToCheck) {
          const colsOfType = currentSemCols.filter(c => c.type === type);
          if (colsOfType.length > 0) {
            let sum = 0;
            colsOfType.forEach(col => {
              const w = parseFloat(draftWeights[col.id]);
              sum += isNaN(w) ? (100 / colsOfType.length) : w;
            });
            if (Math.abs(sum - 100) > 0.01) {
              setWeightNotice({
                type: 'error',
                msg: `Tổng tỉ trọng của loại điểm [${type}] hiện là ${Math.round(sum)}%. Bắt buộc phải đúng 100%.`
              });
              return;
            }
          }
        }

        try {
          await db.collection('classes').doc(selectedClassId).set({
            weights: draftWeights,
            suddenWeight: finalSudden,
            updatedAt: Date.now()
          }, { merge: true });

          localStorage.setItem(`weights_${currentUser.uid}_${selectedClassId}`, JSON.stringify({
            weights: draftWeights,
            suddenWeight: finalSudden
          }));

          setClassWeights({ weights: draftWeights, suddenWeight: finalSudden });
          setWeightNotice({ type: 'success', msg: 'Đã lưu thiết lập tỉ trọng thành công vào lớp học.' });
          loadClassData(selectedClassId);
        } catch (err) {
          localStorage.setItem(`weights_${currentUser.uid}_${selectedClassId}`, JSON.stringify({
            weights: draftWeights,
            suddenWeight: finalSudden
          }));
          setClassWeights({ weights: draftWeights, suddenWeight: finalSudden });
          setWeightNotice({ type: 'success', msg: 'Đã lưu thiết lập tỉ trọng vào bộ nhớ lớp của giáo viên.' });
        }
      };

      const handlePreviewScoreString = () => {
        setStringInputError('');
        setStringParsedScores(null);
        if (!rawScoreString.trim()) {
          setStringInputError('Vui lòng nhập chuỗi điểm');
          return;
        }

        const tokens = rawScoreString.trim().split(/\s+/).map(s => s.replace(',', '.'));
        if (tokens.length !== students.length) {
          setStringInputError(`Chuỗi có ${tokens.length} điểm, nhưng lớp có chính xác ${students.length} học sinh.`);
          return;
        }

        const parsed = [];
        for (let i = 0; i < tokens.length; i++) {
          const val = parseFloat(tokens[i]);
          if (isNaN(val) || val < 0 || val > 10) {
            setStringInputError(`Điểm STT ${i + 1} (${tokens[i]}) không hợp lệ (phải từ 0 đến 10)`);
            return;
          }
          parsed.push(round1(val));
        }
        setStringParsedScores(parsed);
      };

      const handleSaveScoreString = async () => {
        if (!stringParsedScores || !activeColForString || !currentUser) return;
        try {
          const batch = db.batch();
          const now = Date.now();

          students.forEach((st, idx) => {
            const sc = stringParsedScores[idx];
            const entryId = `${currentUser.uid}_${selectedClassId}_${st.id}_${activeColForString.id}`;
            const entryRef = db.collection('scoreEntries').doc(entryId);

            batch.set(entryRef, {
              id: entryId,
              classId: selectedClassId,
              teacherId: currentUser.uid,
              studentId: st.id,
              studentCode: st.studentCode,

      const handleSaveBonusDeduction = async () => {

      const accumulatedBonusStats = useMemo(() => {
        const stats = {};
        students.forEach(st => {

        const semRecords = bonusDeductionList.filter(b => b.semester === semesterSetting.semester);

            }
          }
        });

        students.forEach(st => {

        return stats;
      }, [students, bonusDeductionList, semesterSetting.semester]);

      const handleRunRandomStudent = async () => {
        if (!randomClassId) return;
        try {
          let q = db.collection('students').where('classId', '==', randomClassId);
          if (currentUser.email !== 'toapt989@gmail.com') {
            q = q.where('teacherId', '==', currentUser.uid);
          }
          const snap = await q.get();
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));

          if (list.length === 0) {
            setRandomResults([]);
            return;
          }

          const count = Math.min(Math.max(1, parseInt(randomCount) || 1), list.length);
          const shuffled = [...list];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          setRandomResults(shuffled.slice(0, count));
        } catch (e) {
          console.error("Lỗi random học sinh:", e);
        }
      };

      const tableCalculations = useMemo(() => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const hasSpecial = curClass ? curClass.hasSpecialTopic : true;
        const currentSemCols = scoreColumns.filter(c => c.semester === semesterSetting.semester || c.type === 'CHUYEN_DE');

        return students.map(student => {
          const studentScores = scoreEntries.filter(e => e.studentId === student.id);

          // 1. Quy đổi Thường xuyên báo trước
          const btCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_BAO_TRUOC');
          let btScore = null;
          if (btCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            btCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / btCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            btScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // 2. Quy đổi Điểm nhóm
          const groupCols = currentSemCols.filter(c => c.type === 'DIEM_NHOM');
          let groupScore = null;
          if (groupCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            groupCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / groupCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            groupScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // 3. Quy đổi Thường xuyên cá nhân 2 lần
          const cnCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_CA_NHAN');
          let cn1 = null;
          if (cnCols.length > 0) {
            let sumCn1 = 0;
            let totalW1 = 0;
            cnCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / cnCols.length);
                sumCn1 += ent.score * (w / 100);
                totalW1 += w;
              }
            });
            cn1 = totalW1 > 0 ? round1(sumCn1 / (totalW1 / 100)) : null;
          }

          const dxCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_DOT_XUAT');
          let dxAvg = null;
          if (dxCols.length > 0) {
            let sumDx = 0;
            let countDx = 0;
            dxCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                sumDx += ent.score;
                countDx++;
              }
            });
            dxAvg = countDx > 0 ? round1(sumDx / countDx) : null;
          }

          const suddenW = classWeights.suddenWeight !== undefined ? classWeights.suddenWeight : 20;
          let combinedCnScore = null;
          if (cn1 !== null && dxAvg !== null) {
            combinedCnScore = round1((dxAvg * (suddenW / 100)) + (cn1 * ((100 - suddenW) / 100)));
          } else if (cn1 !== null) {
            combinedCnScore = cn1;
          } else if (dxAvg !== null) {
            combinedCnScore = dxAvg;
          }

          // 4. Quy đổi Chuyên đề
          const cdCols = currentSemCols.filter(c => c.type === 'CHUYEN_DE');
          let cdScore = null;
          if (cdCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            cdCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / cdCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            cdScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          const convertedMap = {
            THUONG_XUYEN_BAO_TRUOC: btScore,
            DIEM_NHOM: groupScore,
            THUONG_XUYEN_CA_NHAN: combinedCnScore,
            CHUYEN_DE: cdScore
          };

          // 5. Áp dụng điểm cải thiện
          const imp = appliedImprovements[student.id];
          if (imp && imp.score !== null && !isNaN(imp.score)) {
            let lowestKey = null;
            let lowestScore = 11;

            ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
              const s = convertedMap[k];
              if (s !== null) {
                if (s === 0) {
                  lowestKey = k;
                  lowestScore = 0;
                } else if (s < lowestScore) {
                  lowestScore = s;
                  lowestKey = k;
                }
              }
            });

            if (lowestKey) {
              if (lowestScore === 0) {
                convertedMap[lowestKey] = round1(imp.score);
              } else {
                const baseWeight = (100 - imp.weight) / 100;
                const impW = imp.weight / 100;
                convertedMap[lowestKey] = round1(convertedMap[lowestKey] * baseWeight + imp.score * impW);
              }
            }
          }

          // 6. Áp dụng điểm cộng / trừ tích lũy CHỈ vào các cột thường xuyên quy đổi
          const netBonus = accumulatedBonusStats[student.id]?.netPoints || 0;

          if (netBonus > 0) {
            let bonusRemain = netBonus;
            while (bonusRemain > 0) {
              let candidateKey = null;
              let minVal = 10;

              ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
                const val = convertedMap[k];
                if (val !== null && val < 10) {
                  if (candidateKey === null || val < minVal) {
                    minVal = val;
                    candidateKey = k;
                  }
                }
              });

              if (!candidateKey) break;
              const curVal = convertedMap[candidateKey];
              const canAdd = Math.min(round1(10 - curVal), bonusRemain);
              convertedMap[candidateKey] = round1(curVal + canAdd);
              bonusRemain = round1(bonusRemain - canAdd);
            }
          } else if (netBonus < 0) {
            let deductRemain = Math.abs(netBonus);
            while (deductRemain > 0) {
              let candidateKey = null;
              let maxVal = -1;

              ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
                const val = convertedMap[k];
                if (val !== null && val > 0) {
                  if (candidateKey === null || val > maxVal) {
                    maxVal = val;
                    candidateKey = k;
                  }
                }
              });

              if (!candidateKey) break;
              const curVal = convertedMap[candidateKey];
              const canDeduct = Math.min(curVal, deductRemain);
              convertedMap[candidateKey] = round1(curVal - canDeduct);
              deductRemain = round1(deductRemain - canDeduct);
            }
          }

          // 7. Điểm Giữa kỳ và Cuối kỳ
          const midE = studentScores.find(e => e.scoreType === 'GIUA_KY' && e.semester === semesterSetting.semester);
          const finE = studentScores.find(e => e.scoreType === 'CUOI_KY' && e.semester === semesterSetting.semester);
          const midterm = (midE && midE.score !== null) ? midE.score : null;
          const finalScore = (finE && finE.score !== null) ? finE.score : null;

          // 8. Tính TBHK: CHỈ TÍNH CÁC CỘT THỰC TẾ ĐÃ CÓ ĐIỂM
          let weightedSum = 0;
          let totalWeightsCount = 0;

          ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
            if (convertedMap[k] !== null) {
              weightedSum += convertedMap[k] * 1;
              totalWeightsCount += 1;
            }
          });

          if (hasSpecial && semesterSetting.calculateSpecialTopic && convertedMap['CHUYEN_DE'] !== null) {
            weightedSum += convertedMap['CHUYEN_DE'] * 1;
            totalWeightsCount += 1;
          }

          if (midterm !== null) {
            weightedSum += midterm * 2;
            totalWeightsCount += 2;
          }

          if (finalScore !== null) {
            weightedSum += finalScore * 3;
            totalWeightsCount += 3;
          }

          const hasAnyScore = totalWeightsCount > 0;
          let tbhk = null;
          if (hasAnyScore) {
            tbhk = round2(weightedSum / totalWeightsCount);
          }

          const rankHk = getAcademicRank(tbhk);

          // 9. Tính TBCN nếu ở HK2
          let tbcn = null;
          let rankCn = '-';
          if (semesterSetting.semester === 'HK2') {
            const hk1Fin = studentScores.find(e => e.semester === 'HK1' && e.scoreType === 'CUOI_KY');
            const pastHk1 = (hk1Fin && hk1Fin.score !== null) ? hk1Fin.score : tbhk;
            if (pastHk1 !== null && tbhk !== null) {
              tbcn = round2((pastHk1 + tbhk * 2) / 3);
              rankCn = getAcademicRank(tbcn);
            }
          }

          return {
            studentId: student.id,
            orderNumber: student.orderNumber,
            studentCode: student.studentCode,
            fullName: student.fullName,
            convertedMap,
            midterm,
            finalScore,
            hasAnyScore,
            tbhk,
            rankHk,
            tbcn,
            rankCn
          };
        });
      }, [students, scoreEntries, scoreColumns, classWeights, appliedImprovements, accumulatedBonusStats, semesterSetting, classes, selectedClassId]);

      const handleDownloadExcel = () => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const headers = ['STT', 'Mã HS', 'Họ và tên', 'TX Báo trước (QĐ)', 'Điểm nhóm (QĐ)', 'TX Cá nhân (QĐ)'];
        if (semesterSetting.calculateSpecialTopic) headers.push('Chuyên đề (QĐ)');
        headers.push('Giữa kỳ (x2)', 'Cuối kỳ (x3)', 'TBHK');
        if (semesterSetting.semester === 'HK2') headers.push('TBCN');

        const rows = tableCalculations.map((st, idx) => {
          const r = [
            st.orderNumber || (idx + 1),
            st.studentCode,
            st.fullName,
            formatScore(st.convertedMap.THUONG_XUYEN_BAO_TRUOC),
            formatScore(st.convertedMap.DIEM_NHOM),
            formatScore(st.convertedMap.THUONG_XUYEN_CA_NHAN)
          ];
          if (semesterSetting.calculateSpecialTopic) {
            r.push(formatScore(st.convertedMap.CHUYEN_DE));
          }
          r.push(
            formatScore(st.midterm),
            formatScore(st.finalScore),
            st.tbhk !== null ? formatScore(st.tbhk) : 'Chưa có điểm'
          );
          if (semesterSetting.semester === 'HK2') {
            r.push(st.tbcn !== null ? formatScore(st.tbcn) : 'Chưa đủ HK');
          }
          return r;
        });

        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `BangDiem_${semesterSetting.semester}`);
        XLSX.writeFile(wb, `BangDiem_${curClass ? curClass.name : 'Lop'}_${semesterSetting.semester}.xlsx`);
        setExcelPreviewOpen(false);
      };

      if (authLoading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-50">

                      <tbody className="divide-y divide-slate-100">
                        {students.map((st, i) => (
                          <tr key={st.id}>
                            <td className="px-3 py-1">{st.orderNumber}</td>
                            <td className="px-3 py-1 font-bold">{st.studentCode}</td>
                            <td className="px-3 py-1">{st.fullName}</td>
                            <td className="px-3 py-1 font-bold text-blue-700">{formatScore(stringParsedScores[i])}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                <div className="flex justify-end gap-2">
                  <button onClick={() => setStringInputModal(false)} className="rounded border border-slate-300 px-3 py-1.5 text-xs font-medium">Hủy</button>
                  <button disabled={!stringParsedScores} onClick={handleSaveScoreString} className="rounded bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white disabled:opacity-50">Lưu điểm</button>
                </div>
              </div>
            </div>
          )}

          {tableInputModal && activeColForTable && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">
              <div className="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl">
                <div className="mb-3 flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900">Nhập điểm bảng: {activeColForTable.name}</h3>
                  <button onClick={() => setTableInputModal(false)} className="text-slate-400 hover:text-slate-600">×</button>
                </div>
                <div className="mb-4 max-h-72 overflow-y-auto rounded border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="sticky top-0 bg-slate-100 text-slate-700">
                      <tr>
                        <th className="px-3 py-2">STT</th>
                        <th className="px-3 py-2">Mã HS</th>
                        <th className="px-3 py-2">Họ tên</th>
                        <th className="w-24 px-3 py-2">Điểm (0-10)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {students.map(st => (
                        <tr key={st.id}>
                          <td className="px-3 py-1.5 font-medium">{st.orderNumber}</td>
                          <td className="px-3 py-1.5 font-bold">{st.studentCode}</td>
                          <td className="px-3 py-1.5">{st.fullName}</td>
                          <td className="px-3 py-1.5">
                            <input
                              type="text"
                              className="w-16 rounded border border-slate-300 px-2 py-0.5 text-center font-bold"
                              value={tableDraftScores[st.id] || ''}
                              onChange={(e) => setTableDraftScores({ ...tableDraftScores, [st.id]: e.target.value })}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setTableInputModal(false)} className="rounded border border-slate-300 px-3 py-1.5 text-xs font-medium">Hủy</button>
                  <button onClick={handleSaveTableScores} className="rounded bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white">Lưu điểm</button>
                </div>
              </div>
            </div>
          )}

          {groupScoreModal && groupTargetCol && groupTargetGroup && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">
              <div className="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
                <div className="mb-3 flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900">Nhập điểm nhóm: {groupTargetGroup.name}</h3>
                  <button onClick={() => setGroupScoreModal(false)} className="text-slate-400 hover:text-slate-600">×</button>
                </div>
                <div className="mb-3">
                  <label className="mb-1 block text-xs font-semibold text-slate-700">Điểm nhóm (0 - 10):</label>
                  <input
                    type="text"
                    className="w-full rounded border border-slate-300 px-3 py-1.5 text-xs focus:outline-none"
                    placeholder="VD: 8,5"
                    value={groupScoreInput}
                    onChange={(e) => setGroupScoreInput(e.target.value)}
                  />
                </div>
                <div className="mb-4">
                  <label className="mb-1 block text-xs font-semibold text-slate-700">Trạng thái tham gia của từng học sinh:</label>
                  <div className="max-h-48 overflow-y-auto rounded border border-slate-200 p-2 space-y-2 text-xs">
                    {(groupTargetGroup.memberStudentIds || []).map(stId => {
                      const st = students.find(s => s.id === stId);
                      if (!st) return null;
                      const hasPart = groupMemberStatus[stId] !== false;
                      return (
                        <div key={stId} className="flex items-center justify-between border-b border-slate-100 pb-1">
                          <span>{st.orderNumber}. {st.fullName} ({st.studentCode})</span>
                          <button
                            type="button"
                            onClick={() => setGroupMemberStatus({ ...groupMemberStatus, [stId]: !hasPart })}
                            className={`rounded px-2 py-0.5 text-xs font-bold transition ${hasPart ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}
                          >
                            {hasPart ? 'Có tham gia' : 'Không (0đ)'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setGroupScoreModal(false)} className="rounded border border-slate-300 px-3 py-1.5 text-xs font-medium">Hủy</button>
                  <button onClick={handleSaveGroupScore} className="rounded bg-blue-700 px-4 py-1.5 text-xs font-semibold text-white">Lưu điểm nhóm</button>
                </div>
              </div>
            </div>
          )}

          {improvementModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">
              <div className="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl">
                <div className="mb-3 flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900">Thiết lập điểm cải thiện</h3>
                  <button onClick={() => setImprovementModal(false)} className="text-slate-400 hover:text-slate-600">×</button>
                </div>
                <p className="mb-2 text-xs text-slate-500">Điểm cải thiện sẽ thay thế điểm 0 hoặc cộng gộp theo trọng số vào cột thường xuyên quy đổi thấp nhất.</p>
                <div className="mb-3 max-w-xs">
                  <label className="mb-1 block text-xs font-semibold text-slate-700">Trọng số cải thiện (%):</label>
                  <input
                    type="number"
                    min="1"
                    max="100"
                    className="w-24 rounded border border-slate-300 px-2 py-1 text-xs"
                    value={improvementWeight}
                    onChange={(e) => setImprovementWeight(parseInt(e.target.value) || 30)}
                  />
                </div>
                <div className="mb-4 max-h-56 overflow-y-auto rounded border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="sticky top-0 bg-slate-100 text-slate-700">
                      <tr><th className="px-3 py-1.5">STT</th><th className="px-3 py-1.5">Mã HS</th><th className="px-3 py-1.5">Họ tên</th><th className="w-24 px-3 py-1.5">Điểm cải thiện</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {students.map(st => (
                        <tr key={st.id}>
                          <td className="px-3 py-1 font-medium">{st.orderNumber}</td>
                          <td className="px-3 py-1 font-bold">{st.studentCode}</td>
                          <td className="px-3 py-1">{st.fullName}</td>
                          <td className="px-3 py-1">
                            <input
                              type="text"
                              className="w-16 rounded border border-slate-300 px-2 py-0.5 text-center font-bold"
                              placeholder="0 - 10"
                              value={improvementDraftScores[st.id] || ''}
                              onChange={(e) => setImprovementDraftScores({ ...improvementDraftScores, [st.id]: e.target.value })}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setImprovementModal(false)} className="rounded border border-slate-300 px-3 py-1.5 text-xs font-medium">Hủy</button>
                  <button
                    onClick={() => {
                      const updated = {};
                      Object.keys(improvementDraftScores).forEach(sid => {
                        const v = parseFloat(improvementDraftScores[sid].replace(',', '.'));
                        if (!isNaN(v) && v >= 0 && v <= 10) {
                          updated[sid] = { score: round1(v), weight: improvementWeight };
                        }
                      });
                      setAppliedImprovements(updated);
                      setImprovementModal(false);
                    }}
                    className="rounded bg-blue-700 px-4 py-1.5 text-xs font-semibold text-white"
                  >
                    Áp dụng
                  </button>
                </div>
              </div>
            </div>
          )}

          {excelPreviewOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">
              <div className="w-full max-w-4xl rounded-xl bg-white p-6 shadow-xl">
                <div className="mb-3 flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900">XEM TRƯỚC BẢNG ĐIỂM XUẤT EXCEL ({semesterSetting.semester})</h3>
                  <button onClick={() => setExcelPreviewOpen(false)} className="text-slate-400 hover:text-slate-600">×</button>
                </div>
                <p className="mb-3 text-xs text-slate-500">Các cột xếp loại chỉ hiển thị trên web và tra cứu, không đưa vào file Excel khi xuất.</p>
                <div className="mb-4 max-h-72 overflow-y-auto rounded border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="sticky top-0 bg-slate-100 text-slate-700">
                      <tr>
                        <th className="px-2 py-1.5">STT</th>
                        <th className="px-2 py-1.5">Mã HS</th>
                        <th className="px-2 py-1.5">Họ tên</th>
                        <th className="px-2 py-1.5">TX Báo trước (QĐ)</th>
                        <th className="px-2 py-1.5">Điểm nhóm (QĐ)</th>
                        <th className="px-2 py-1.5">TX Cá nhân (QĐ)</th>
                        {semesterSetting.calculateSpecialTopic && <th className="px-2 py-1.5">Chuyên đề (QĐ)</th>}
                        <th className="px-2 py-1.5">Giữa kỳ</th>
                        <th className="px-2 py-1.5">Cuối kỳ</th>
                        <th className="px-2 py-1.5">TBHK</th>
                        {semesterSetting.semester === 'HK2' && <th className="px-2 py-1.5">TBCN</th>}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {tableCalculations.map(st => (
                        <tr key={st.studentId}>
                          <td className="px-2 py-1">{st.orderNumber}</td>
                          <td className="px-2 py-1 font-bold">{st.studentCode}</td>
                          <td className="px-2 py-1">{st.fullName}</td>
                          <td className="px-2 py-1">{formatScore(st.convertedMap.THUONG_XUYEN_BAO_TRUOC)}</td>
                          <td className="px-2 py-1">{formatScore(st.convertedMap.DIEM_NHOM)}</td>
                          <td className="px-2 py-1">{formatScore(st.convertedMap.THUONG_XUYEN_CA_NHAN)}</td>
                          {semesterSetting.calculateSpecialTopic && <td className="px-2 py-1">{formatScore(st.convertedMap.CHUYEN_DE)}</td>}
                          <td className="px-2 py-1">{formatScore(st.midterm)}</td>
                          <td className="px-2 py-1">{formatScore(st.finalScore)}</td>
                          <td className="px-2 py-1 font-bold">{st.tbhk !== null ? formatScore(st.tbhk) : '-'}</td>
                          {semesterSetting.semester === 'HK2' && <td className="px-2 py-1 font-bold">{st.tbcn !== null ? formatScore(st.tbcn) : '-'}</td>}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setExcelPreviewOpen(false)} className="rounded border border-slate-300 px-3 py-1.5 text-xs font-medium">Quay lại</button>
                  <button onClick={handleDownloadExcel} className="rounded bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white hover:bg-emerald-700">Xác nhận xuất Excel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PublicLookupComponent({ semesterSetting }) {
      const [lookupCode, setLookupCode] = useState('');
      const [searching, setSearching] = useState(false);
      const [studentData, setStudentData] = useState(null);
      const [className, setClassName] = useState('');
      const [currentGroupName, setCurrentGroupName] = useState('Chưa xếp nhóm');
      const [historyRows, setHistoryRows] = useState([]);
      const [msg, setMsg] = useState('');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!lookupCode.trim()) return;

        setSearching(true);
        setMsg('');
        setStudentData(null);
        setClassName('');
        setCurrentGroupName('Chưa xếp nhóm');
        setHistoryRows([]);

        try {
          const qCode = lookupCode.trim().toUpperCase();
          const stSnap = await db.collection('students').where('studentCode', '==', qCode).get();

          if (stSnap.empty) {
            setMsg('Không tìm thấy học sinh với mã: ' + qCode);
            setSearching(false);
            return;
          }

          const st = stSnap.docs[0].data();
          setStudentData(st);

          if (st.classId) {
            const clsDoc = await db.collection('classes').doc(st.classId).get();
            if (clsDoc.exists) setClassName(clsDoc.data().name || '');

            const grpSnap = await db.collection('groups').where('classId', '==', st.classId).get();
            grpSnap.forEach(gd => {
              const gData = gd.data();
              if (gData.memberStudentIds && gData.memberStudentIds.includes(st.id)) {
                setCurrentGroupName(gData.name);
              }
            });
          }

          const histSnap = await db.collection('scoreHistory').where('studentCode', '==', qCode).get();
          const allHist = [];
          histSnap.forEach(d => allHist.push(d.data()));
          allHist.sort((a, b) => b.timestamp - a.timestamp);

          const seenScoreColumns = new Set();
          const filteredRows = [];

          for (const row of allHist) {
            const isSpecial = row.scoreType === 'DIEM_CONG' || row.scoreType === 'DIEM_TRU' || row.reason?.includes('cải thiện');
            if (isSpecial) {
              filteredRows.push(row);
            } else {
              const key = `${row.semester || ''}_${row.scoreColumnName || ''}`;
              if (!seenScoreColumns.has(key)) {
                seenScoreColumns.add(key);
                filteredRows.push(row);
              }
            }
          }

          setHistoryRows(filteredRows);
        } catch (err) {
          setMsg('Lỗi tra cứu: ' + err.message);
        } finally {
          setSearching(false);
        }
      };

      return (
        <div>
          <form onSubmit={handleSearch} className="mb-6 flex gap-2">
            <input
              type="text"
              required
              className="w-full max-w-sm rounded border border-slate-300 px-3 py-2 text-xs focus:border-blue-600 focus:outline-none"
              placeholder="Nhập mã học sinh (VD: HS001)"
              value={lookupCode}
              onChange={(e) => setLookupCode(e.target.value)}
            />
            <button type="submit" disabled={searching} className="rounded bg-blue-700 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-800 disabled:opacity-50">
              {searching ? 'Đang tra cứu...' : 'Tra cứu ngay'}
            </button>
          </form>

          {msg && <div className="mb-4 rounded bg-rose-50 p-2.5 text-xs font-semibold text-rose-600 border border-rose-200">{msg}</div>}

          {studentData && (
            <div className="space-y-4">
              <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
                <div className="text-base font-bold text-blue-900">{studentData.fullName}</div>
                <div className="mt-2 flex flex-wrap gap-4 text-xs text-slate-600">
                  <span>Mã HS: <strong className="text-slate-800">{studentData.studentCode}</strong></span>
                  <span>STT: <strong className="text-slate-800">{studentData.orderNumber}</strong></span>
                  <span>Lớp: <strong className="text-blue-700">{className || 'Chưa cập nhật'}</strong></span>
                  <span>Nhóm hiện tại: <strong className="text-emerald-700">{currentGroupName}</strong></span>
                </div>
              </div>

              <div>
                <div className="mb-2 text-xs font-bold text-slate-800">
                  BẢNG ĐIỂM GHI NHẬN MỚI NHẤT & LỊCH SỬ ĐIỂM CỘNG/TRỪ
                </div>
                <p className="mb-2 text-xs text-slate-500">Mỗi cột điểm gốc hiển thị bản ghi mới nhất. Lịch sử điểm cộng và điểm trừ hiển thị toàn bộ chi tiết.</p>
                <div className="overflow-x-auto rounded-lg border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-700">
                      <tr>
                        <th className="px-3 py-2">Thời gian</th>
                        <th className="px-3 py-2">Học kỳ</th>
                        <th className="px-3 py-2">Loại ghi nhận</th>
                        <th className="px-3 py-2">Cột điểm / Tác vụ</th>
                        <th className="px-3 py-2">Điểm / Mức</th>
                        <th className="px-3 py-2">Lý do & Trạng thái</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {historyRows.length === 0 ? (
                        <tr><td colSpan={6} className="px-3 py-4 text-center text-slate-400">Chưa có bản ghi điểm nào được lưu</td></tr>
                      ) : (
                        historyRows.map((r, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="px-3 py-2 font-medium text-slate-500">{new Date(r.timestamp).toLocaleDateString('vi-VN')}</td>
                            <td className="px-3 py-2">{r.semester || '-'}</td>
                            <td className="px-3 py-2">
                              <span className={`inline-block rounded px-2 py-0.5 text-xs font-semibold ${r.scoreType === 'DIEM_CONG' ? 'bg-emerald-100 text-emerald-800' : (r.scoreType === 'DIEM_TRU' ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800')}`}>
                                {r.scoreType}
                              </span>
                            </td>
                            <td className="px-3 py-2 font-bold text-slate-800">{r.scoreColumnName || '-'}</td>
                            <td className={`px-3 py-2 font-black ${r.scoreType === 'DIEM_TRU' ? 'text-rose-600' : 'text-blue-700'}`}>
                              {r.scoreType === 'DIEM_CONG' ? `+${r.newScore}đ` : (r.scoreType === 'DIEM_TRU' ? `${r.newScore}đ` : formatScore(r.newScore))}
                            </td>
                            <td className="px-3 py-2 text-slate-600">
                              {r.participationStatus === 'KHONG_THAM_GIA' ? (
                                <span className="font-bold text-rose-600">Không tham gia nhóm (0 điểm)</span>
                              ) : (
                                r.reason || 'Lần nhập mới nhất'
                              )}
                              {r.groupSnapshot && ` [Nhóm: ${r.groupSnapshot.groupName}]`}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
