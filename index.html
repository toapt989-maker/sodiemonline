<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Quản Lý Lớp Học & Sổ Điểm Điện Tử</title>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

    header { background-color: var(--primary); color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-md); flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-actions { display: flex; align-items: center; gap: 12px; }

    .nav-bar { background-color: #ffffff; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 0 16px; box-shadow: var(--shadow-sm); }
    .nav-bar button { background: none; border: none; padding: 14px 18px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .nav-bar button:hover { color: var(--primary); }
    .nav-bar button.active { color: var(--primary); border-bottom-color: var(--primary); }

    .sub-bar { background: #f1f5f9; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .sub-bar-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; }

    .container { max-width: 1320px; margin: 24px auto; padding: 0 16px; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; color: var(--primary); border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; transition: border-color 0.2s; background: #ffffff; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 90px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; gap: 6px; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-danger:hover { background-color: #b91c1c; }
    .btn-success { background-color: var(--success); color: white; }
    .btn-success:hover { background-color: #15803d; }
    .btn-warning { background-color: var(--warning); color: white; }
    .btn-warning:hover { background-color: #b45309; }
    .btn-secondary { background-color: #64748b; color: white; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background-color: #f1f5f9; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    table th, table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    table th { background-color: #f8fafc; font-weight: 600; color: #334155; }
    table tr:nth-child(even) { background-color: #fdfdfe; }
    table tr:hover { background-color: #f1f5f9; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-primary { background-color: #dbeafe; color: #1e40af; }
    .badge-success { background-color: #dcfce7; color: #166534; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }
    .badge-warning { background-color: #fef3c7; color: #92400e; }
    .badge-rank { font-weight: 700; padding: 4px 8px; border-radius: 6px; }

    .modal-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(2px); }
    .modal-box { background-color: white; border-radius: 10px; max-width: 860px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }

    .random-box { background: var(--primary-light); border: 2px dashed #3b82f6; border-radius: 8px; padding: 16px; text-align: center; }
    .random-num { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .random-name { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .text-center { text-align: center; }
    .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    .stat-pill { background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBKI6CPLt3M159K9GdD0GUVfDIAaYzemvg",
      authDomain: "sodiemonline.firebaseapp.com",
      projectId: "sodiemonline",
      storageBucket: "sodiemonline.firebasestorage.app",
      messagingSenderId: "928218267233",
      appId: "1:928218267233:web:889914f0ebcbf529eeb420",
      measurementId: "G-LEF5EWHC11"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const round1 = (val) => Math.round(val * 10) / 10;
    const round2 = (val) => Math.round(val * 100) / 100;
    const formatScore = (val) => (val === null || val === undefined || isNaN(val)) ? '-' : val.toString().replace('.', ',');

    const getAcademicRank = (score) => {
      if (score === null || score === undefined || isNaN(score)) return '-';
      if (score >= 9.0) return 'Xuất sắc';
      if (score >= 8.0) return 'Tốt';
      if (score >= 6.5) return 'Khá';
      if (score >= 5.0) return 'Đạt';
      return 'Chưa đạt';
    };

    const getRankBadgeClass = (rank) => {
      switch (rank) {
        case 'Xuất sắc': return 'badge-success';
        case 'Tốt': return 'badge-primary';
        case 'Khá': return 'badge-warning';
        case 'Đạt': return 'badge-secondary';
        case 'Chưa đạt': return 'badge-danger';
        default: return '';
      }
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginSubmitting, setLoginSubmitting] = useState(false);

      const [currentTab, setCurrentTab] = useState('DASHBOARD');

      // State dữ liệu chung
      const [semesterSetting, setSemesterSetting] = useState({ semester: 'HK1', calculateSpecialTopic: false });
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');

      // State dữ liệu lớp
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [scoreColumns, setScoreColumns] = useState([]);
      const [scoreEntries, setScoreEntries] = useState([]);
      const [scoreHistories, setScoreHistories] = useState([]);
      const [bonusDeductionEntries, setBonusDeductionEntries] = useState([]);
      const [classWeights, setClassWeights] = useState({}); // { [colId]: weightNumber, suddenWeight: number }

      // State quản lý lớp & học sinh
      const [newClassName, setNewClassName] = useState('');
      const [newClassSpecial, setNewClassSpecial] = useState(true);
      const [importRawStudents, setImportRawStudents] = useState('');
      const [importError, setImportError] = useState('');

      // State quản lý nhóm
      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupMembers, setSelectedGroupMembers] = useState([]);

      // State nhập điểm nhóm
      const [groupScoreModal, setGroupScoreModal] = useState(false);
      const [groupScoreTargetCol, setGroupScoreTargetCol] = useState(null);
      const [groupScoreTargetGroup, setGroupScoreTargetGroup] = useState(null);
      const [groupScoreVal, setGroupScoreVal] = useState('');
      const [groupMemberParticipations, setGroupMemberParticipations] = useState({});

      // State chuyển loại cột điểm
      const [moveColModalOpen, setMoveColModalOpen] = useState(false);
      const [colToMove, setColToMove] = useState(null);
      const [targetScoreType, setTargetScoreType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // State tạo cột điểm mới
      const [newColName, setNewColName] = useState('');
      const [newColType, setNewColType] = useState('THUONG_XUYEN_BAO_TRUOC');

      // State nhập điểm chuỗi
      const [stringInputModal, setStringInputModal] = useState(false);
      const [activeColForInput, setActiveColForInput] = useState(null);
      const [rawScoreString, setRawScoreString] = useState('');
      const [parsedPreviewScores, setParsedPreviewScores] = useState(null);
      const [stringInputError, setStringInputError] = useState('');

      // State nhập bảng
      const [tableInputModal, setTableInputModal] = useState(false);
      const [activeColForTableInput, setActiveColForTableInput] = useState(null);
      const [tableDraftScores, setTableDraftScores] = useState({});

      // State tỉ trọng dạng draft tại danh sách cột
      const [draftWeights, setDraftWeights] = useState({});
      const [draftSuddenWeight, setDraftSuddenWeight] = useState(20);
      const [weightErrorMessage, setWeightErrorMessage] = useState('');

      // State điểm cải thiện
      const [improvementModal, setImprovementModal] = useState(false);
      const [improvementWeight, setImprovementWeight] = useState(30);
      const [improvementDraftScores, setImprovementDraftScores] = useState({});
      const [appliedImprovements, setAppliedImprovements] = useState({});

      // State Điểm cộng / Điểm trừ mới
      const [actionType, setActionType] = useState('CONG'); // 'CONG' hoặc 'TRU'
      const [bonusDeductionModal, setBonusDeductionModal] = useState(false);
      const [bonusDeductionReason, setBonusDeductionReason] = useState('');
      const [bonusDeductionSelections, setBonusDeductionSelections] = useState({}); // { [studentId]: points }

      // State Random học sinh
      const [randomClassId, setRandomClassId] = useState('');
      const [randomQty, setRandomQty] = useState(1);
      const [randomResults, setRandomResults] = useState([]);

      // State Xuất Excel Preview
      const [excelPreviewOpen, setExcelPreviewOpen] = useState(false);

      // State Hộp thoại xác nhận xóa (Custom confirm modal)
      const [confirmModal, setConfirmModal] = useState({
        open: false,
        title: '',
        message: '',
        onConfirm: null
      });

      const requestConfirm = (title, message, onConfirm) => {
        setConfirmModal({
          open: true,
          title,
          message,
          onConfirm: async () => {
            setConfirmModal(prev => ({ ...prev, open: false }));
            if (onConfirm) await onConfirm();
          }
        });
      };

      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
          setCurrentUser(user);
          setAuthLoading(false);
          if (user) {
            setCurrentTab('DASHBOARD');
          }
        });
        return () => unsubscribe();
      }, []);

      const loadGlobalConfig = async () => {
        try {
          const db = firebase.firestore();
          const semDoc = await db.collection('semesterSettings').doc('GLOBAL_CONFIG').get();
          if (semDoc.exists) {
            setSemesterSetting(semDoc.data());
          }

          const classSnap = await db.collection('classes').get();
          const list = [];
          classSnap.forEach(d => list.push({ id: d.id, ...d.data() }));
          setClasses(list);
          if (list.length > 0 && !selectedClassId) {
            setSelectedClassId(list[0].id);
            setRandomClassId(list[0].id);
          }
        } catch (e) {
          console.error("Lỗi nạp cấu hình:", e);
        }
      };

      useEffect(() => {
        loadGlobalConfig();
      }, [currentUser]);

      const loadClassData = async (classId) => {
        if (!classId || !currentUser) return;
        try {
          const db = firebase.firestore();

          // 1. Học sinh
          const stSnap = await db.collection('students').where('classId', '==', classId).get();
          const stList = [];
          stSnap.forEach(d => stList.push({ id: d.id, ...d.data() }));
          stList.sort((a, b) => a.orderNumber - b.orderNumber);
          setStudents(stList);

          // 2. Nhóm
          const grpSnap = await db.collection('groups').where('classId', '==', classId).get();
          const grpList = [];
          grpSnap.forEach(d => grpList.push({ id: d.id, ...d.data() }));
          setGroups(grpList);

          // 3. Cột điểm gốc
          const colSnap = await db.collection('scoreColumns').where('classId', '==', classId).get();
          const colList = [];
          colSnap.forEach(d => colList.push({ id: d.id, ...d.data() }));
          setScoreColumns(colList);

          // 4. Điểm nhập
          const entSnap = await db.collection('scoreEntries').where('classId', '==', classId).get();
          const entList = [];
          entSnap.forEach(d => entList.push({ id: d.id, ...d.data() }));
          setScoreEntries(entList);

          // 5. Lịch sử điểm
          const histSnap = await db.collection('scoreHistory').where('classId', '==', classId).get();
          const histList = [];
          histSnap.forEach(d => histList.push({ id: d.id, ...d.data() }));
          histList.sort((a, b) => b.timestamp - a.timestamp);
          setScoreHistories(histList);

          // 6. Điểm cộng & trừ tích lũy
          const bdSnap = await db.collection('bonusDeductionEntries').where('classId', '==', classId).get();
          const bdList = [];
          bdSnap.forEach(d => bdList.push({ id: d.id, ...d.data() }));
          setBonusDeductionEntries(bdList);

          // 7. Tỉ trọng của lớp
          const weightDoc = await db.collection('classWeights').doc(classId).get();
          if (weightDoc.exists) {
            const wData = weightDoc.data();
            setClassWeights(wData);
            setDraftWeights(wData.weights || {});
            setDraftSuddenWeight(wData.suddenWeight !== undefined ? wData.suddenWeight : 20);
          } else {
            setClassWeights({});
            setDraftWeights({});
            setDraftSuddenWeight(20);
          }

        } catch (err) {
          console.error("Lỗi khi tải dữ liệu lớp:", err);
        }
      };

      useEffect(() => {
        if (selectedClassId && currentUser) {
          loadClassData(selectedClassId);
        }
      }, [selectedClassId, currentUser]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginSubmitting(true);
        try {
          await firebase.auth().signInWithEmailAndPassword(loginEmail.trim(), loginPass);
          setLoginModalOpen(false);
          setLoginEmail('');
          setLoginPass('');
        } catch (err) {
          setLoginError('Đăng nhập không thành công, vui lòng kiểm tra email và mật khẩu');
        } finally {
          setLoginSubmitting(false);
        }
      };

      const handleLogout = async () => {
        await firebase.auth().signOut();
        setCurrentTab('DASHBOARD');
      };

      const handleSaveSemesterSetting = async (sem, calcSpecial) => {
        const payload = { semester: sem, calculateSpecialTopic: calcSpecial, updatedAt: Date.now() };
        try {
          await firebase.firestore().collection('semesterSettings').doc('GLOBAL_CONFIG').set(payload);
          setSemesterSetting(payload);
        } catch (e) {
          console.error("Lỗi cập nhật học kỳ:", e);
        }
      };

      const handleCreateClass = async (e) => {
        e.preventDefault();
        if (!newClassName.trim()) return;
        try {
          const db = firebase.firestore();
          const ref = db.collection('classes').doc();
          const newCls = {
            id: ref.id,
            name: newClassName.trim(),
            hasSpecialTopic: newClassSpecial,
            createdAt: Date.now(),
            createdBy: currentUser.email
          };
          await ref.set(newCls);
          setNewClassName('');
          await loadGlobalConfig();
          setSelectedClassId(newCls.id);
        } catch (err) {
          console.error("Lỗi tạo lớp:", err);
        }
      };

      const handleDeleteClass = (classId) => {
        requestConfirm(
          'Xác nhận xóa lớp học',
          'Bạn có chắc chắn muốn xóa lớp học này? Toàn bộ dữ liệu điểm và học sinh của lớp sẽ không thể hoàn tác.',
          async () => {
            try {
              const db = firebase.firestore();
              await db.collection('classes').doc(classId).delete();
              await loadGlobalConfig();
              if (selectedClassId === classId) {
                setSelectedClassId(classes.find(c => c.id !== classId)?.id || '');
              }
            } catch (e) {
              console.error("Lỗi xóa lớp:", e);
            }
          }
        );
      };

      const handleImportStudents = async (e) => {
        e.preventDefault();
        setImportError('');
        if (!importRawStudents.trim() || !selectedClassId) return;

        const lines = importRawStudents.trim().split('\n').filter(l => l.trim().length > 0);
        const parsed = [];
        const seenCodes = new Set();

        for (let i = 0; i < lines.length; i++) {
          const parts = lines[i].split(',').map(s => s.trim());
          if (parts.length !== 3) {
            setImportError(`Dòng ${i + 1} cần đúng định dạng: STT,Mã HS,Họ và tên`);
            return;
          }
          const orderNum = parseInt(parts[0], 10);
          const code = parts[1].toUpperCase();
          const name = parts[2];

          if (isNaN(orderNum) || !code || !name) {
            setImportError(`Dòng ${i + 1} có giá trị chưa hợp lệ`);
            return;
          }

          if (seenCodes.has(code)) {
            setImportError(`Trùng lặp Mã HS ${code} tại dòng ${i + 1}`);
            return;
          }
          seenCodes.add(code);
          parsed.push({ orderNumber: orderNum, studentCode: code, fullName: name });
        }

        try {
          const db = firebase.firestore();
          const batch = db.batch();

          parsed.forEach(st => {
            const ref = db.collection('students').doc(`${selectedClassId}_${st.studentCode}`);
            batch.set(ref, {
              id: `${selectedClassId}_${st.studentCode}`,
              classId: selectedClassId,
              orderNumber: st.orderNumber,
              studentCode: st.studentCode,
              fullName: st.fullName,
              createdAt: Date.now()
            });
          });

          await batch.commit();
          setImportRawStudents('');
          loadClassData(selectedClassId);
        } catch (err) {
          setImportError('Lỗi khi lưu danh sách học sinh: ' + err.message);
        }
      };

      const handleCreateColumn = async (e) => {
        e.preventDefault();
        if (!newColName.trim() || !selectedClassId) return;
        try {
          const db = firebase.firestore();
          const colRef = db.collection('scoreColumns').doc();
          await colRef.set({
            id: colRef.id,
            classId: selectedClassId,
            name: newColName.trim(),
            type: newColType,
            semester: semesterSetting.semester,
            createdAt: Date.now()
          });
          setNewColName('');
          loadClassData(selectedClassId);
        } catch (err) {
          console.error("Lỗi tạo cột:", err);
        }
      };

      const handleDeleteColumn = (col) => {
        requestConfirm(
          'Xác nhận xóa cột điểm gốc',
          `Bạn có chắc chắn muốn xóa cột điểm "${col.name}"? Toàn bộ điểm học sinh đã nhập trong cột này sẽ bị xóa bỏ.`,
          async () => {
            try {
              const db = firebase.firestore();
              const batch = db.batch();

              // Xóa tài liệu cột điểm
              batch.delete(db.collection('scoreColumns').doc(col.id));

              // Xóa các điểm nhập liên quan
              const entriesSnap = await db.collection('scoreEntries')
                .where('classId', '==', selectedClassId)
                .where('scoreColumnId', '==', col.id)
                .get();

              entriesSnap.forEach(d => batch.delete(d.ref));

              // Ghi vết xóa vào lịch sử
              const hRef = db.collection('scoreHistory').doc();
              batch.set(hRef, {
                id: hRef.id,
                classId: selectedClassId,

      const handleSaveBonusDeduction = async () => {

      // Thống kê tổng điểm cộng và trừ tích lũy theo từng học sinh trong học kỳ hiện tại
      const accumulatedBonusDeduction = useMemo(() => {
        const stats = {};
        students.forEach(st => {
          stats[st.id] = { totalBonus: 0, totalDeduction: 0, netPoints: 0 };
        });

        const semEntries = bonusDeductionEntries.filter(e => e.semester === semesterSetting.semester);
        semEntries.forEach(entry => {
          if (stats[entry.studentId]) {
            if (entry.type === 'CONG') {
              stats[entry.studentId].totalBonus = round2(stats[entry.studentId].totalBonus + Math.abs(entry.points));
            } else if (entry.type === 'TRU') {
              stats[entry.studentId].totalDeduction = round2(stats[entry.studentId].totalDeduction + Math.abs(entry.points));
            }
          }
        });

        students.forEach(st => {
          stats[st.id].netPoints = round2(stats[st.id].totalBonus - stats[st.id].totalDeduction);
        });

        return stats;
      }, [students, bonusDeductionEntries, semesterSetting.semester]);

      const handleRunRandom = async () => {
        if (!randomClassId) return;
        try {
          const db = firebase.firestore();
          const snap = await db.collection('students').where('classId', '==', randomClassId).get();
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));

          if (list.length === 0) {
            setRandomResults([]);
            return;
          }

          const count = Math.min(Math.max(1, parseInt(randomQty) || 1), list.length);
          const shuffled = [...list];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          setRandomResults(shuffled.slice(0, count));
        } catch (e) {
          console.error("Lỗi random học sinh:", e);
        }
      };

      const tableCalculations = useMemo(() => {
        const curClass = classes.find(c => c.id === selectedClassId);
        const hasSpecial = curClass ? curClass.hasSpecialTopic : true;
        const currentSemCols = scoreColumns.filter(c => c.semester === semesterSetting.semester || c.type === 'CHUYEN_DE');

        return students.map(student => {
          const studentScores = scoreEntries.filter(e => e.studentId === student.id);

          // 1. Quy đổi Thường xuyên báo trước
          const btCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_BAO_TRUOC');
          let btScore = null;
          if (btCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            btCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / btCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            btScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // 2. Quy đổi Điểm nhóm
          const groupCols = currentSemCols.filter(c => c.type === 'DIEM_NHOM');
          let groupScore = null;
          if (groupCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            groupCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / groupCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            groupScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // 3. Quy đổi Thường xuyên cá nhân kết hợp Thường xuyên đột xuất
          const cnCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_CA_NHAN');
          const dxCols = currentSemCols.filter(c => c.type === 'THUONG_XUYEN_DOT_XUAT');

          let cnBaseScore = null;
          if (cnCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            cnCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / cnCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            cnBaseScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // Điểm trung bình đột xuất
          let dxAvg = null;
          if (dxCols.length > 0) {
            let sumDx = 0;
            let countDx = 0;
            dxCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                sumDx += ent.score;
                countDx++;
              }
            });
            dxAvg = countDx > 0 ? round1(sumDx / countDx) : null;
          }

          // Kết hợp cá nhân và đột xuất theo tỉ trọng X%
          const suddenWeightVal = classWeights.suddenWeight !== undefined ? classWeights.suddenWeight : 20;
          let combinedCnScore = null;
          if (cnBaseScore !== null && dxAvg !== null) {
            combinedCnScore = round1(cnBaseScore * ((100 - suddenWeightVal) / 100) + dxAvg * (suddenWeightVal / 100));
          } else if (cnBaseScore !== null) {
            combinedCnScore = cnBaseScore;
          } else if (dxAvg !== null) {
            combinedCnScore = dxAvg;
          }

          // 4. Quy đổi Chuyên đề
          const cdCols = currentSemCols.filter(c => c.type === 'CHUYEN_DE');
          let cdScore = null;
          if (cdCols.length > 0) {
            let sum = 0;
            let totalW = 0;
            cdCols.forEach(col => {
              const ent = studentScores.find(e => e.scoreColumnId === col.id);
              if (ent && ent.score !== null && !isNaN(ent.score)) {
                const w = parseFloat(classWeights.weights?.[col.id]) || (100 / cdCols.length);
                sum += ent.score * (w / 100);
                totalW += w;
              }
            });
            cdScore = totalW > 0 ? round1(sum / (totalW / 100)) : null;
          }

          // Thu thập các cột quy đổi thành map
          const convertedMap = {
            THUONG_XUYEN_BAO_TRUOC: btScore,
            DIEM_NHOM: groupScore,
            THUONG_XUYEN_CA_NHAN: combinedCnScore,
            CHUYEN_DE: cdScore
          };

          // 5. Áp dụng Điểm cải thiện
          const imp = appliedImprovements[student.id];
          if (imp && imp.score !== null && !isNaN(imp.score)) {
            let lowestKey = null;
            let lowestScore = 11;

            ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
              const s = convertedMap[k];
              if (s !== null) {
                if (s === 0) {
                  lowestKey = k;
                  lowestScore = 0;
                } else if (s < lowestScore) {
                  lowestScore = s;
                  lowestKey = k;
                }
              }
            });

            if (lowestKey) {
              if (lowestScore === 0) {
                convertedMap[lowestKey] = round1(imp.score);
              } else {
                const baseWeight = (100 - imp.weight) / 100;
                const impW = imp.weight / 100;
                convertedMap[lowestKey] = round1(convertedMap[lowestKey] * baseWeight + imp.score * impW);
              }
            }
          }

          // 6. Áp dụng Điểm cộng & Điểm trừ tích lũy (CHỈ VÀO THƯỜNG XUYÊN QUY ĐỔI)
          const netBonus = accumulatedBonusDeduction[student.id]?.netPoints || 0;

          if (netBonus > 0) {
            let bonusRemain = netBonus;
            while (bonusRemain > 0) {
              let candidateKey = null;
              let minVal = 10;

              ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
                const val = convertedMap[k];
                if (val !== null && val < 10) {
                  if (candidateKey === null || val < minVal) {
                    minVal = val;
                    candidateKey = k;
                  }
                }
              });

              if (!candidateKey) break;
              const curVal = convertedMap[candidateKey];
              const canAdd = Math.min(round1(10 - curVal), bonusRemain);
              convertedMap[candidateKey] = round1(curVal + canAdd);
              bonusRemain = round1(bonusRemain - canAdd);
            }
          } else if (netBonus < 0) {
            let deductRemain = Math.abs(netBonus);
            while (deductRemain > 0) {
              let candidateKey = null;
              let maxVal = -1;

              ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
                const val = convertedMap[k];
                if (val !== null && val > 0) {
                  if (candidateKey === null || val > maxVal) {
                    maxVal = val;
                    candidateKey = k;
                  }
                }
              });

              if (!candidateKey) break;
              const curVal = convertedMap[candidateKey];
              const canDeduct = Math.min(curVal, deductRemain);
              convertedMap[candidateKey] = round1(curVal - canDeduct);
              deductRemain = round1(deductRemain - canDeduct);
            }
          }

          // 7. Điểm Giữa kỳ và Cuối kỳ (Tuyệt đối không cộng trừ vào đây)
          const midE = studentScores.find(e => e.scoreType === 'GIUA_KY' && e.semester === semesterSetting.semester);
          const finE = studentScores.find(e => e.scoreType === 'CUOI_KY' && e.semester === semesterSetting.semester);
          const midterm = (midE && midE.score !== null) ? midE.score : null;
          const finalScore = (finE && finE.score !== null) ? finE.score : null;

          // 8. Cột thường xuyên hợp lệ tham gia tính trung bình
          const validRegular = [];
          ['THUONG_XUYEN_BAO_TRUOC', 'DIEM_NHOM', 'THUONG_XUYEN_CA_NHAN'].forEach(k => {
            if (convertedMap[k] !== null) validRegular.push(convertedMap[k]);
          });

          if (hasSpecial && semesterSetting.calculateSpecialTopic && convertedMap['CHUYEN_DE'] !== null) {
            validRegular.push(convertedMap['CHUYEN_DE']);
          }

          // Kiểm tra xem học sinh đã có bất kỳ cột điểm nào chưa
          const hasAnyScore = validRegular.length > 0 || midterm !== null || finalScore !== null;

          // Tính TBHK
          let tbhk = null;
          if (midterm !== null && finalScore !== null && validRegular.length > 0) {
            const sumReg = validRegular.reduce((a, b) => a + b, 0);
            tbhk = round2((sumReg + midterm * 2 + finalScore * 3) / (validRegular.length + 5));
          }

          // Xếp loại học kỳ
          const rankHk = getAcademicRank(tbhk);

          // Tính TBCN và xếp loại cả năm
          let tbcn = null;
          let rankCn = '-';
          if (semesterSetting.semester === 'HK2') {
            const hk1Fin = studentScores.find(e => e.semester === 'HK1' && e.scoreType === 'CUOI_KY');
            const fakeHk1 = (hk1Fin && hk1Fin.score !== null) ? hk1Fin.score : tbhk;
            if (fakeHk1 !== null && tbhk !== null) {
              tbcn = round2((fakeHk1 + tbhk * 2) / 3);
              rankCn = getAcademicRank(tbcn);
            }
          }

          return {
            studentId: student.id,
            orderNumber: student.orderNumber,
            studentCode: student.studentCode,
            fullName: student.fullName,
            convertedMap,
            midterm,
            finalScore,
            hasAnyScore,
            tbhk,
            rankHk,
            tbcn,
            rankCn
          };
        });
      }, [students, scoreEntries, scoreColumns, classWeights, appliedImprovements, accumulatedBonusDeduction, semesterSetting, classes, selectedClassId]);

      const handleDownloadExcel = () => {
        const curClass = classes.find(c => c.id === selectedClassId);

        if (semesterSetting.calculateSpecialTopic) headers.push('Chuyên đề (QĐ)');
        headers.push('Giữa kỳ (x2)', 'Cuối kỳ (x3)', 'TBHK');
        if (semesterSetting.semester === 'HK2') headers.push('TBCN');

        const rows = tableCalculations.map((st, idx) => {
          const r = [
            st.orderNumber || (idx + 1),
            st.studentCode,
            st.fullName,
            formatScore(st.convertedMap.THUONG_XUYEN_BAO_TRUOC),
            formatScore(st.convertedMap.DIEM_NHOM),
            formatScore(st.convertedMap.THUONG_XUYEN_CA_NHAN)

          if (semesterSetting.calculateSpecialTopic) {

          if (semesterSetting.semester === 'HK2') {
            r.push(st.tbcn !== null ? formatScore(st.tbcn) : 'Chưa đủ HK');
          }
          return r;
        });

        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `BangDiem_${semesterSetting.semester}`);
        XLSX.writeFile(wb, `BangDiem_${curClass ? curClass.name : 'Lop'}_${semesterSetting.semester}.xlsx`);
        setExcelPreviewOpen(false);

            <div className="header-actions">
              {currentUser ? (

                  </button>
                </div>

                <div className="sub-bar-group">
                  <span>Tính chuyên đề trong kỳ:</span>
                  <button 
                    className={`btn btn-sm ${semesterSetting.calculateSpecialTopic ? 'btn-success' : 'btn-outline'}`}

                  >
                    BẬT
                  </button>
                  <button 
                    className={`btn btn-sm ${!semesterSetting.calculateSpecialTopic ? 'btn-warning' : 'btn-outline'}`}

                </div>

                <div className="sub-bar-group">
                  <span>Lớp đang chọn:</span>
                  <select 
                    className="form-control" 
                    style={{ width: 170, padding: '4px 8px' }}

                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
              </div>

              <div className="nav-bar">
                <button className={currentTab === 'DASHBOARD' ? 'active' : ''} onClick={() => setCurrentTab('DASHBOARD')}>Bảng điều khiển</button>
                <button className={currentTab === 'SCORES' ? 'active' : ''} onClick={() => setCurrentTab('SCORES')}>Bảng điểm & Cột điểm</button>

                          return (
                            <tr key={st.id}>
                              <td>{st.orderNumber}</td>

                              <td style={{ fontWeight: 700 }}>

                {/* Tạo cột điểm mới */}

                  Điểm cải thiện sẽ thay thế điểm 0 hoặc cộng gộp theo trọng số vào cột thường xuyên quy đổi thấp nhất.
                </p>
                <div className="form-group" style={{ maxWidth: 200 }}>
                  <label>Trọng số cải thiện (%):</label>
                  <input 
                    type="number" 
                    min="1" 
                    max="100" 
                    className="form-control" 
                    value={improvementWeight} 
                    onChange={(e) => setImprovementWeight(parseInt(e.target.value) || 30)} 
                  />
                </div>
                <div style={{ maxHeight: 300, overflowY: 'auto', marginBottom: 16 }}>
                  <table>
                    <thead>
                      <tr><th>STT</th><th>Mã HS</th><th>Họ tên</th><th>Điểm bài cải thiện</th></tr>
                    </thead>
                    <tbody>
                      {students.map(st => (
                        <tr key={st.id}>
                          <td>{st.orderNumber}</td>
                          <td>{st.studentCode}</td>
                          <td>{st.fullName}</td>
                          <td>
                            <input 
                              type="text" 
                              className="form-control"
                              style={{ padding: '4px 8px', width: 100 }}
                              placeholder="0 - 10"
                              value={improvementDraftScores[st.id] || ''}
                              onChange={(e) => setImprovementDraftScores({ ...improvementDraftScores, [st.id]: e.target.value })}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setImprovementModal(false)}>Đóng</button>
                  <button className="btn btn-primary" onClick={() => {
                    const newApplied = {};
                    Object.keys(improvementDraftScores).forEach(sid => {
                      const val = parseFloat(improvementDraftScores[sid].replace(',', '.'));
                      if (!isNaN(val) && val >= 0 && val <= 10) {
                        newApplied[sid] = { score: round1(val), weight: improvementWeight };
                      }
                    });
                    setAppliedImprovements(newApplied);
                    setImprovementModal(false);
                  }}>Áp dụng</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Xem trước Excel */}
          {excelPreviewOpen && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div className="modal-header">
                  <h3>XEM TRƯỚC BẢNG ĐIỂM XUẤT EXCEL ({semesterSetting.semester})</h3>
                  <button className="modal-close" onClick={() => setExcelPreviewOpen(false)}>×</button>
                </div>
                <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: 12 }}>
                  Lưu ý: Các cột xếp loại chỉ hiển thị trên web và tra cứu, không đưa vào file Excel đã xuất.
                </p>
                <div style={{ maxHeight: 380, overflowY: 'auto', marginBottom: 16 }}>
                  <table>
                    <thead>
                      <tr>
                        <th>STT</th><th>Mã HS</th><th>Họ tên</th>
                        <th>TX Báo trước (QĐ)</th><th>Điểm nhóm (QĐ)</th><th>TX Cá nhân (QĐ)</th>
                        {semesterSetting.calculateSpecialTopic && <th>Chuyên đề (QĐ)</th>}
                        <th>Giữa kỳ</th><th>Cuối kỳ</th><th>TBHK</th>
                        {semesterSetting.semester === 'HK2' && <th>TBCN</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {tableCalculations.map(st => (
                        <tr key={st.studentId}>
                          <td>{st.orderNumber}</td><td>{st.studentCode}</td><td>{st.fullName}</td>
                          <td>{formatScore(st.convertedMap.THUONG_XUYEN_BAO_TRUOC)}</td>
                          <td>{formatScore(st.convertedMap.DIEM_NHOM)}</td>
                          <td>{formatScore(st.convertedMap.THUONG_XUYEN_CA_NHAN)}</td>
                          {semesterSetting.calculateSpecialTopic && <td>{formatScore(st.convertedMap.CHUYEN_DE)}</td>}
                          <td>{formatScore(st.midterm)}</td><td>{formatScore(st.finalScore)}</td>
                          <td style={{ fontWeight: 600 }}>{st.tbhk !== null ? formatScore(st.tbhk) : '-'}</td>
                          {semesterSetting.semester === 'HK2' && (
                            <td style={{ fontWeight: 600 }}>{st.tbcn !== null ? formatScore(st.tbcn) : '-'}</td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setExcelPreviewOpen(false)}>Quay lại chỉnh sửa</button>
                  <button className="btn btn-success" onClick={handleDownloadExcel}>Xác nhận xuất Excel</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function PublicLookupView({ semesterSetting }) {
      const [lookupCode, setLookupCode] = useState('');
      const [searching, setSearching] = useState(false);
      const [studentData, setStudentData] = useState(null);
      const [historyRows, setHistoryRows] = useState([]);
      const [studentSummary, setStudentSummary] = useState(null);
      const [msg, setMsg] = useState('');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!lookupCode.trim()) return;

        setSearching(true);
        setMsg('');
        setStudentData(null);
        setHistoryRows([]);
        setStudentSummary(null);

        try {
          const db = firebase.firestore();
          const qCode = lookupCode.trim().toUpperCase();

          const stSnap = await db.collection('students').where('studentCode', '==', qCode).get();
          if (stSnap.empty) {
            setMsg('Không tìm thấy học sinh với mã: ' + qCode);
            setSearching(false);
            return;
          }

          const st = stSnap.docs[0].data();
          setStudentData(st);

          // Lấy lịch sử điểm, điểm cộng, điểm trừ, điểm cải thiện
          const hSnap = await db.collection('scoreHistory').where('studentCode', '==', qCode).get();
          const list = [];
          hSnap.forEach(d => list.push(d.data()));
          list.sort((a, b) => b.timestamp - a.timestamp);
          setHistoryRows(list);

          // Tính toán nhanh kết quả điểm hiện thời
          const entSnap = await db.collection('scoreEntries')
            .where('classId', '==', st.classId)
            .where('studentId', '==', st.id)
            .get();

          let mid = null;
          let fin = null;
          entSnap.forEach(d => {
            const data = d.data();
            if (data.scoreType === 'GIUA_KY' && data.semester === semesterSetting.semester) mid = data.score;
            if (data.scoreType === 'CUOI_KY' && data.semester === semesterSetting.semester) fin = data.score;
          });

          setStudentSummary({
            midterm: mid,
            finalScore: fin
          });

        } catch (err) {
          setMsg('Lỗi tra cứu: ' + err.message);
        } finally {
          setSearching(false);
        }
      };

      return (
        <div>
          <form onSubmit={handleSearch} style={{ display: 'flex', gap: 10, marginBottom: 20 }}>
            <input 
              type="text" 
              required 
              className="form-control" 
              placeholder="Nhập mã học sinh (VD: HS001)" 
              value={lookupCode} 
              onChange={(e) => setLookupCode(e.target.value)} 
              style={{ maxWidth: 320 }}
            />
            <button type="submit" className="btn btn-primary" disabled={searching}>
              {searching ? 'Đang tra cứu...' : 'Tra cứu ngay'}
            </button>
          </form>

          {msg && <div style={{ color: 'var(--danger)', fontSize: '0.9rem', marginBottom: 12 }}>{msg}</div>}

          {studentData && (
            <div>
              <div style={{ background: '#f1f5f9', padding: 16, borderRadius: 8, marginBottom: 20 }}>
                <div style={{ fontSize: '1.05rem', fontWeight: 700, color: 'var(--primary)' }}>{studentData.fullName}</div>
                <div style={{ fontSize: '0.85rem', color: '#475569', marginTop: 4 }}>
                  Mã học sinh: <strong>{studentData.studentCode}</strong> | STT: <strong>{studentData.orderNumber}</strong>
                </div>
                {studentSummary && (
                  <div style={{ marginTop: 10, display: 'flex', gap: 16, fontSize: '0.85rem' }}>
                    <span>Giữa kỳ: <strong>{formatScore(studentSummary.midterm)}</strong></span>
                    <span>Cuối kỳ: <strong>{formatScore(studentSummary.finalScore)}</strong></span>
                  </div>
                )}
              </div>

              <h4 style={{ fontSize: '0.95rem', marginBottom: 10, color: 'var(--primary)' }}>LỊCH SỬ ĐIỂM, ĐIỂM CỘNG, ĐIỂM TRỪ & ĐIỂM CẢI THIỆN</h4>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Thời gian</th>
                      <th>Học kỳ</th>
                      <th>Loại ghi nhận</th>
                      <th>Cột điểm / Tác vụ</th>
                      <th>Điểm / Mức</th>
                      <th>Lý do & Trạng thái</th>
                    </tr>
                  </thead>
                  <tbody>
                    {historyRows.length === 0 ? (
                      <tr><td colSpan={6} className="text-center">Chưa có bản ghi điểm nào được lưu</td></tr>
                    ) : (
                      historyRows.map((r, i) => (
                        <tr key={i}>
                          <td>{new Date(r.timestamp).toLocaleDateString('vi-VN')}</td>
                          <td>{r.semester || '-'}</td>
                          <td>
                            <span className={`badge ${
                              r.scoreType === 'DIEM_CONG' ? 'badge-success' : 
                              (r.scoreType === 'DIEM_TRU' ? 'badge-danger' : 'badge-primary')
                            }`}>
                              {r.scoreType}
                            </span>
                          </td>
                          <td>{r.scoreColumnName || '-'}</td>
                          <td style={{ fontWeight: 700, color: r.scoreType === 'DIEM_TRU' ? 'var(--danger)' : 'var(--primary)' }}>
                            {r.scoreType === 'DIEM_CONG' ? `+${r.newScore}đ` : (r.scoreType === 'DIEM_TRU' ? `${r.newScore}đ` : formatScore(r.newScore))}
                          </td>
                          <td>
                            {r.participationStatus === 'KHONG_THAM_GIA' ? (
                              <span style={{ color: 'var(--danger)', fontWeight: 600 }}>Không tham gia nhóm (0 điểm)</span>
                            ) : (
                              r.reason || 'Bình thường'
                            )}
                            {r.groupSnapshot && ` [Nhóm: ${r.groupSnapshot.groupName}]`}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
